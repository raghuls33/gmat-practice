","B","E","A","C"],["B","A","C","E","D"]]},{"n":12,"lvl":"medium","note":"","grid":[["","","D","B","E"],["","","","",""],["","E","C","","D"],["D","","E","",""],["","B","A","",""]],"t":[1,0],"ans":"C","full":[["A","C","D","B","E"],["C","D","B","E","A"],["B","E","C","A","D"],["D","A","E","C","B"],["E","B","A","D","C"]]},{"n":13,"lvl":"medium","note":"","grid":[["B","","","E",""],["","","","",""],["","","B","D",""],["D","","C","B",""],["E","B","D","C",""]],"t":[2,1],"ans":"E","full":[["B","C","A","E","D"],["C","D","E","A","B"],["A","E","B","D","C"],["D","A","C","B","E"],["E","B","D","C","A"]]},{"n":14,"lvl":"medium","note":"","grid":[["","","","A",""],["","E","","",""],["C","A","","B","E"],["A","","","",""],["","B","A","E",""]],"t":[1,4],"ans":"A","full":[["E","C","B","A","D"],["B","E","C","D","A"],["C","A","D","B","E"],["A","D","E","C","B"],["D","B","A","E","C"]]},{"n":15,"lvl":"high","note":"","grid":[["","","","","D"],["","C","","",""],["B","","","E",""],["","B","","","E"],["","E","A","",""]],"t":[1,0],"ans":"A","full":[["E","A","B","C","D"],["A","C","E","D","B"],["B","D","C","E","A"],["C","B","D","A","E"],["D","E","A","B","C"]]},{"n":16,"lvl":"high","note":"","grid":[["C","B","","D",""],["","","","","D"],["","","","C","A"],["D","","","",""],["","","E","",""]],"t":[3,2],"ans":"C","full":[["C","B","A","D","E"],["E","C","B","A","D"],["B","E","D","C","A"],["D","A","C","E","B"],["A","D","E","B","C"]]},{"n":17,"lvl":"high","note":"","grid":[["","E","","",""],["","","","D","E"],["","A","","","C"],["D","","","A",""],["C","","","",""]],"t":[0,0],"ans":"B","full":[["B","E","A","C","D"],["A","B","C","D","E"],["E","A","D","B","C"],["D","C","E","A","B"],["C","D","B","E","A"]]},{"n":18,"lvl":"high","note":"","grid":[["","D","","E",""],["","","","","D"],["","B","","C",""],["","","E","",""],["A","","","","C"]],"t":[3,0],"ans":"C","full":[["B","D","C","E","A"],["E","C","B","A","D"],["D","B","A","C","E"],["C","A","E","D","B"],["A","E","D","B","C"]]},{"n":19,"lvl":"high","note":"","grid":[["B","","","E",""],["","","","",""],["","","B","",""],["A","","","B","E"],["","D","","A",""]],"t":[2,3],"ans":"C","full":[["B","A","C","E","D"],["E","B","A","D","C"],["D","E","B","C","A"],["A","C","D","B","E"],["C","D","E","A","B"]]},{"n":20,"lvl":"high","note":"","grid":[["","D","","C",""],["","","B","E",""],["E","","","D",""],["","","","",""],["","","A","","D"]],"t":[2,4],"ans":"A","full":[["A","D","E","C","B"],["D","A","B","E","C"],["E","B","C","D","A"],["B","C","D","A","E"],["C","E","A","B","D"]]}],"subject":[{"title":"Testlet 1 — Control Flow, Recursion and Program Semantics","area":"Applied Computer Science · Questions 1–8","stimulus":"<p>A program's <strong>control flow</strong> determines the order in which statements are executed. A <code>while</code> loop repeats its body while a condition holds; an <code>if</code>/<code>else</code> branch selects one of two paths. Reasoning about a loop means finding an <strong>invariant</strong>, a statement that is true before the loop starts and after every iteration, together with a quantity that strictly decreases so that the loop terminates.</p><p>A <strong>recursive</strong> function calls itself on a smaller input and must contain a <em>base case</em> that returns without recursing. Without a base case, or with a recursive call that does not reduce the input, the recursion never terminates and the call stack overflows.</p><p>Two idioms occur constantly in data work. <strong>Integer division and modulo</strong> split a number into a quotient and a remainder: for non-negative integers, <code>a = (a / b) * b + a % b</code>. <strong>Short-circuit evaluation</strong> means that in <code>A &amp;&amp; B</code> the sub-expression <code>B</code> is not evaluated at all when <code>A</code> is false, and in <code>A || B</code> it is not evaluated when <code>A</code> is true — which is why a guard such as <code>if (arr != null &amp;&amp; arr.length &gt; 0)</code> is safe.</p>","questions":[{"n":1,"stem":"<p>What is the value of <code>total</code> after this loop?</p><pre>total = 0\nfor i = 1 to 5:\n    if i % 2 == 0:\n        total = total + i\n    else:\n        total = total + 1</pre>","options":["15","9","12","6"],"ans":1,"expl":"i = 1 → +1; i = 2 → +2; i = 3 → +1; i = 4 → +4; i = 5 → +1. Total = <strong>9</strong>."},{"n":2,"stem":"<p>How many times is the body of this loop executed?</p><pre>n = 40\ncount = 0\nwhile n &gt; 1:\n    n = n / 2      (integer division)\n    count = count + 1</pre>","options":["4","5","6","20"],"ans":2,"expl":"40 → 20 → 10 → 5 → 2 → 1: six halvings, so the body runs <strong>6</strong> times. Integer division makes 5/2 = 2, which is easy to miss."},{"n":3,"stem":"<p>What does this recursive function return for <code>f(4)</code>?</p><pre>f(n):\n    if n &lt;= 1: return 1\n    return n * f(n - 1)</pre>","options":["10","16","24","4"],"ans":2,"expl":"4 · 3 · 2 · 1 = <strong>24</strong>; the function is the factorial."},{"n":4,"stem":"<p>A recursive function is written without a base case, but every call reduces its argument by 1. What happens at run time?</p>","options":["It returns 0 by default.","The compiler rejects it before the program runs.","It recurses until the call stack is exhausted and the program fails.","It terminates as soon as the argument reaches zero."],"ans":2,"expl":"Nothing stops the descent, so the call stack grows until it overflows. Compilers do not detect this in general."},{"n":5,"stem":"<p>Which expression correctly computes the last two digits of a non-negative integer <code>n</code>?</p>","options":["`n / 100`","`n % 100`","`n % 10`","`n / 10 % 10`"],"ans":1,"expl":"<code>n % 100</code> is the remainder after dividing by 100, i.e. the last two digits. <code>n / 100</code> gives everything <em>except</em> them."},{"n":6,"stem":"<p>Why is <code>if (arr != null &amp;&amp; arr.length &gt; 0)</code> safe, while <code>if (arr.length &gt; 0 &amp;&amp; arr != null)</code> may crash?</p>","options":["Because the second version compares in the wrong order alphabetically.","Because `&&` short-circuits, so in the first version `arr.length` is only evaluated once `arr` is known to be non-null.","Because `!=` binds more tightly than `>`.","Because array length is not defined for empty arrays."],"ans":1,"expl":"<code>&amp;&amp;</code> short-circuits left to right, so <code>arr.length</code> is only reached when <code>arr != null</code> has already evaluated to true. Reversing the order dereferences a possibly null array first."},{"n":7,"stem":"<p>What is the value of <code>x</code> after this fragment?</p><pre>x = 1\nfor i = 1 to 3:\n    for j = 1 to 2:\n        x = x * 2</pre>","options":["12","32","64","8"],"ans":2,"expl":"The inner loop runs 2 times per outer iteration, so <code>x</code> is doubled 3 · 2 = 6 times: 2⁶ = <strong>64</strong>."},{"n":8,"stem":"<p>A loop over a list is written so that the loop variable is also modified inside the body. Which property is most at risk?</p>","options":["type safety","termination","short-circuit evaluation","operator precedence"],"ans":1,"expl":"Modifying the loop variable inside the body can prevent the loop's decreasing quantity from ever reaching its bound, so the loop may not terminate."}]},{"title":"Testlet 2 — Probability Distributions and Sampling","area":"Mathematics · Questions 9–16","stimulus":"<p>A <strong>random variable</strong> assigns a number to each outcome of an experiment. Its <strong>expected value</strong> E[X] is the probability-weighted average of the values it can take, and its <strong>variance</strong> Var(X) = E[(X − E[X])²] measures spread.</p><p>Three distributions dominate applied work. The <strong>Bernoulli</strong> distribution describes a single trial with success probability <em>p</em>, so E[X] = p and Var(X) = p(1 − p). The <strong>binomial</strong> distribution counts the successes in <em>n</em> independent Bernoulli trials: P(X = k) = C(n, k) · pᵏ · (1 − p)ⁿ⁻ᵏ, with E[X] = n·p and Var(X) = n·p·(1 − p). The <strong>normal</strong> distribution is symmetric about its mean and fully described by μ and σ.</p><p>Two results govern sampling. <strong>Linearity of expectation</strong> states that E[X + Y] = E[X] + E[Y] whether or not X and Y are independent, whereas variances add only when the variables are independent. The <strong>central limit theorem</strong> says that the sampling distribution of the mean of <em>n</em> independent observations approaches a normal distribution as <em>n</em> grows, with mean μ and <strong>standard error</strong> σ / √n — which is why quadrupling the sample size halves the standard error.</p>","questions":[{"n":9,"stem":"<p>A fair coin is tossed 10 times. What is the expected number of heads and the variance of that count?</p>","options":["E = 5, Var = 5","E = 5, Var = 2.5","E = 10, Var = 5","E = 5, Var = 0.5"],"ans":1,"expl":"Binomial with n = 10, p = 0.5: E = n·p = 5 and Var = n·p·(1 − p) = 10 · 0.25 = <strong>2.5</strong>."},{"n":10,"stem":"<p>A single trial succeeds with probability p = 0.2. What is its variance?</p>","options":["0.20","0.16","0.04","0.80"],"ans":1,"expl":"Bernoulli variance = p(1 − p) = 0.2 · 0.8 = <strong>0.16</strong>."},{"n":11,"stem":"<p>Three independent trials each succeed with probability 0.5. What is the probability of exactly two successes?</p>","options":["0.125","0.250","0.375","0.500"],"ans":2,"expl":"C(3, 2) · 0.5² · 0.5¹ = 3 · 0.125 = <strong>0.375</strong>."},{"n":12,"stem":"<p>A population has σ = 20. A sample of size 100 is drawn. What is the standard error of the sample mean?</p>","options":["20","2","0.2","4"],"ans":1,"expl":"SE = σ/√n = 20/√100 = 20/10 = <strong>2</strong>."},{"n":13,"stem":"<p>The standard error of a sample mean must be halved. By what factor must the sample size be multiplied?</p>","options":["2","4","8","16"],"ans":1,"expl":"SE ∝ 1/√n, so halving it needs √n doubled, i.e. n multiplied by <strong>4</strong>."},{"n":14,"stem":"<p>For which pair of statements is independence <strong>required</strong>?</p>","options":["E[X + Y] = E[X] + E[Y]","Var(X + Y) = Var(X) + Var(Y)","E[cX] = c · E[X]","Var(cX) = c² · Var(X)"],"ans":1,"expl":"Expectation is linear regardless of dependence; variances add only for independent variables. Options c and d hold for any single variable."},{"n":15,"stem":"<p>A die is rolled once. What is the expected value of the result?</p>","options":["3.0","3.5","4.0","2.5"],"ans":1,"expl":"(1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = <strong>3.5</strong>, a value the die can never actually show."},{"n":16,"stem":"<p>What does the central limit theorem allow you to assume about the mean of a large sample drawn from a strongly skewed population?</p>","options":["The population itself becomes normal as n grows.","The sample mean is normally distributed with standard error σ / √n.","The sample median equals the population mean.","The variance of the population shrinks as n grows."],"ans":1,"expl":"The CLT is a statement about the <em>sampling distribution of the mean</em>, not about the population, which stays as skewed as it ever was."}]},{"title":"Testlet 3 — Sets, Logic and Formal Languages","area":"Theoretical Computer Science · Questions 17–24","stimulus":"<p>For sets A and B in a universe U, |A ∪ B| = |A| + |B| − |A ∩ B| — the <strong>inclusion–exclusion principle</strong> — and the complement satisfies |Ā| = |U| − |A|. The <strong>power set</strong> of a set with <em>n</em> elements has 2ⁿ members, and the <strong>Cartesian product</strong> A × B has |A| · |B| members.</p><p>In propositional logic, an implication A ⇒ B is false only when A is true and B is false, which makes it equivalent to ¬A ∨ B. Its <strong>contrapositive</strong> ¬B ⇒ ¬A is always equivalent to it, whereas its <strong>converse</strong> B ⇒ A is not. <strong>De Morgan's laws</strong> state that ¬(A ∧ B) = ¬A ∨ ¬B and ¬(A ∨ B) = ¬A ∧ ¬B.</p><p>A <strong>deterministic finite automaton (DFA)</strong> has a finite set of states, one start state, a transition function and a set of accepting states; the languages it recognises are exactly the <strong>regular</strong> languages. Regular expressions describe the same class. Languages requiring unbounded counting — the classic example being the strings aⁿbⁿ — are <em>not</em> regular, because a finite automaton has no memory of how many symbols it has seen.</p>","questions":[{"n":17,"stem":"<p>In a group of 100 students, 60 study Python, 45 study R and 25 study both. How many study at least one of the two?</p>","options":["105","80","70","130"],"ans":1,"expl":"|A ∪ B| = 60 + 45 − 25 = <strong>80</strong>."},{"n":18,"stem":"<p>How many subsets does a set with 6 elements have?</p>","options":["12","36","64","720"],"ans":2,"expl":"2⁶ = <strong>64</strong>."},{"n":19,"stem":"<table><thead><tr><th>A</th><th>= 3 and</th><th>B</th><th>= 4. How many elements does A × B have?</th></tr></thead><tbody></tbody></table>","options":["7","12","64","81"],"ans":1,"expl":"|A × B| = 3 · 4 = <strong>12</strong>."},{"n":20,"stem":"<p>Which statement is logically equivalent to A ⇒ B?</p>","options":["B ⇒ A","¬A ⇒ ¬B","¬B ⇒ ¬A","A ∧ ¬B"],"ans":2,"expl":"Only the contrapositive ¬B ⇒ ¬A is equivalent. The converse (a) and the inverse (b) are not; (d) is the negation of the implication."},{"n":21,"stem":"<p>Applying De Morgan's law, ¬(A ∨ B) equals:</p>","options":["¬A ∨ ¬B","¬A ∧ ¬B","A ∧ B","¬(A ∧ B)"],"ans":1,"expl":"¬(A ∨ B) = ¬A ∧ ¬B."},{"n":22,"stem":"<p>Under which single assignment is the implication A ⇒ B false?</p>","options":["A = false, B = false","A = false, B = true","A = true, B = true","A = true, B = false"],"ans":3,"expl":"An implication fails only when the premise holds and the conclusion does not."},{"n":23,"stem":"<p>Which language cannot be recognised by a deterministic finite automaton?</p>","options":["all strings over {a, b} of even length","all strings of the form aⁿbⁿ for n ≥ 1","all strings containing the substring `ab`","all strings ending in `b`"],"ans":1,"expl":"aⁿbⁿ needs unbounded counting of the a's, which a finite state set cannot do. The other three languages are regular."},{"n":24,"stem":"<p>A DFA has 4 states and an input alphabet of 3 symbols. How many entries does its transition table contain?</p>","options":["7","12","43","64"],"ans":1,"expl":"One entry per (state, symbol) pair: 4 · 3 = <strong>12</strong>."}]},{"title":"Testlet 4 — Neural Networks and Gradient-Based Optimisation","area":"Applied Computer Science · Questions 25–32","stimulus":"<p>A <strong>feed-forward neural network</strong> is a chain of layers. Each unit computes a weighted sum of its inputs plus a bias, then applies a non-linear <strong>activation function</strong>. A fully connected layer mapping <em>m</em> inputs to <em>n</em> outputs therefore holds m · n weights and <em>n</em> biases.</p><p>Without a non-linearity, stacking layers is pointless: the composition of linear maps is itself a linear map. <strong>ReLU</strong>, defined as max(0, z), is the usual default because its gradient is 1 for positive inputs and so does not shrink towards zero the way the sigmoid's does; the price is that units stuck at negative inputs receive no gradient at all. <strong>Softmax</strong> turns a vector of scores into a probability distribution over classes and is paired with cross-entropy loss.</p><p>Training uses <strong>gradient descent</strong>: the parameters move against the gradient of the loss, w ← w − η · ∂L/∂w, where η is the <strong>learning rate</strong>. Too large a learning rate makes the loss oscillate or diverge; too small a rate makes training crawl. <strong>Backpropagation</strong> is the application of the chain rule that computes all these gradients in one backward pass. <strong>Dropout</strong> and weight decay are regularisers that combat overfitting; dropout is active during training only and is switched off at inference.</p>","questions":[{"n":25,"stem":"<p>A fully connected layer maps 100 inputs to 50 outputs. How many trainable parameters does it have, counting biases?</p>","options":["5 000","5 050","150","5 100"],"ans":1,"expl":"100 · 50 weights = 5 000, plus 50 biases = <strong>5 050</strong>."},{"n":26,"stem":"<p>What happens if every activation function in a deep network is removed (i.e. made the identity)?</p>","options":["The network becomes equivalent to a single linear layer.","The network trains faster but is otherwise unchanged.","Backpropagation no longer applies.","The number of parameters falls to zero."],"ans":0,"expl":"A composition of linear maps is linear, so the whole stack collapses to one linear layer no matter how deep it is. This is precisely why non-linearities exist."},{"n":27,"stem":"<p>What is the output of ReLU for the input vector (−3, 0, 2, 7)?</p>","options":["(0, 0, 2, 7)","(−3, 0, 2, 7)","(3, 0, 2, 7)","(0, 1, 2, 7)"],"ans":0,"expl":"ReLU(z) = max(0, z), applied component-wise → <strong>(0, 0, 2, 7)</strong>."},{"n":28,"stem":"<p>Which activation is the natural choice for the output layer of a 5-class classifier?</p>","options":["ReLU","softmax","sigmoid on each unit independently","the identity"],"ans":1,"expl":"Softmax produces a normalised distribution over the 5 mutually exclusive classes. Independent sigmoids would be right for multi-<em>label</em> problems."},{"n":29,"stem":"<p>During training the loss oscillates wildly and sometimes increases. What is the most likely cause?</p>","options":["The learning rate is too large.","The learning rate is too small.","There are too few parameters.","Dropout has been switched off."],"ans":0,"expl":"Steps that overshoot the minimum make the loss bounce or diverge. A learning rate that is too small produces slow but monotone progress."},{"n":30,"stem":"<p>What does backpropagation actually compute?</p>","options":["The optimal weights in closed form.","The gradient of the loss with respect to every parameter, using the chain rule.","The number of layers needed for a given task.","The learning rate schedule."],"ans":1,"expl":"Backpropagation is the chain rule applied efficiently in one backward pass; the weight update itself is the optimiser's job."},{"n":31,"stem":"<p>Dropout with rate 0.5 is used in a network. What happens at inference time?</p>","options":["Dropout is switched off and all units are used.","Half the units are still dropped at random.","The weights are halved permanently.","The network must be retrained without dropout."],"ans":0,"expl":"Dropout is a training-time regulariser. At inference every unit is used, with activations scaled so the expected value matches training."},{"n":32,"stem":"<p>A network reaches near-zero training loss while its validation loss rises steadily after epoch 10. What is the most appropriate action?</p>","options":["Increase the number of layers.","Train for many more epochs.","Apply early stopping and regularisation.","Remove the validation set."],"ans":2,"expl":"A rising validation loss against a falling training loss is textbook overfitting; stop early and regularise rather than adding capacity."}]},{"title":"Testlet 5 — Vectors, Norms and Distance","area":"Mathematics · Questions 33–40","stimulus":"<p>A vector's <strong>Euclidean norm</strong> (the L2 norm) is ‖v‖₂ = √(Σ vᵢ²); its <strong>Manhattan norm</strong> (L1) is Σ |vᵢ|. The <strong>Euclidean distance</strong> between two points is the L2 norm of their difference. A vector is <strong>normalised</strong> by dividing it by its own norm, which leaves its direction unchanged and sets its length to 1.</p><p><strong>Cosine similarity</strong> measures the angle between two vectors: cos θ = (u · v) / (‖u‖ · ‖v‖). It ranges from −1 to 1, ignores magnitude entirely, and equals 0 exactly when the vectors are <strong>orthogonal</strong>, i.e. when their dot product is zero. This is why cosine similarity is the standard choice for comparing documents or embeddings, where length reflects document size rather than meaning.</p><p>Distance metrics matter because scale does. If one feature is measured in metres and another in millimetres, the second dominates any Euclidean distance. <strong>Standardisation</strong> (subtracting the mean and dividing by the standard deviation) puts all features on a comparable footing, which is why distance-based methods such as k-nearest neighbours and k-means are sensitive to it while tree-based methods are not.</p>","questions":[{"n":33,"stem":"<p>What is the Euclidean norm of the vector [3, 4]?</p>","options":["7","5","12","25"],"ans":1,"expl":"√(9 + 16) = √25 = <strong>5</strong>."},{"n":34,"stem":"<p>What is the Manhattan (L1) norm of the vector [3, −4, 2]?</p>","options":["9","1","5.39","29"],"ans":0,"expl":"|3| + |−4| + |2| = <strong>9</strong>. (5.39 is the L2 norm — the standard trap.)"},{"n":35,"stem":"<p>What is the Euclidean distance between the points [1, 2] and [4, 6]?</p>","options":["5","7","25","3.5"],"ans":0,"expl":"The difference is [3, 4], whose norm is √(9 + 16) = <strong>5</strong>."},{"n":36,"stem":"<p>Which pair of vectors is orthogonal?</p>","options":["[1, 2] and [2, 4]","[1, 0] and [0, 5]","[1, 1] and [2, 2]","[3, 1] and [1, 3]"],"ans":1,"expl":"[1, 0] · [0, 5] = 0. In every other option the vectors are parallel or at a non-right angle."},{"n":37,"stem":"<p>What is the cosine similarity of [1, 0] and [0, 1]?</p>","options":["1","0","−1","0.5"],"ans":1,"expl":"Orthogonal vectors have dot product 0, so cos θ = <strong>0</strong>."},{"n":38,"stem":"<p>What is the cosine similarity of [2, 4] and [1, 2]?</p>","options":["0","0.5","1","10"],"ans":2,"expl":"[2, 4] = 2 · [1, 2]: the vectors point the same way, so cos θ = <strong>1</strong>. Cosine similarity ignores magnitude entirely."},{"n":39,"stem":"<p>The vector [6, 8] is normalised. What is the result?</p>","options":["[0.6, 0.8]","[3, 4]","[0.75, 1]","[1, 1]"],"ans":0,"expl":"‖[6, 8]‖ = 10, so the unit vector is [0.6, 0.8]."},{"n":40,"stem":"<p>One feature is recorded in metres and another in millimetres. Which method is most affected if the features are not standardised?</p>","options":["a decision tree","k-nearest neighbours","counting the number of missing values","a rule that thresholds a single feature"],"ans":1,"expl":"kNN is distance-based, so the millimetre feature, having numerically larger values, would dominate every distance. Trees split one feature at a time and are invariant to monotone rescaling."}]}]},{"id":4,"fs":[{"n":1,"lvl":"low","note":"","given":[[{"g":"■","c":4,"r":3,"k":"","o":0}],[{"g":"■","c":4,"r":4,"k":"","o":0}],[{"g":"■","c":4,"r":3,"k":"","o":0}],[{"g":"■","c":4,"r":2,"k":"","o":0}]],"o1":[[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":4,"r":2,"k":"","o":0}],[{"g":"■","c":3,"r":0,"k":"","o":0}]],"o2":[[{"g":"■","c":4,"r":0,"k":"","o":0}],[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":3,"r":0,"k":"","o":0}]],"a1":1,"a2":1,"rules":["■ moves vertically one field at a time in column ε and bounces off the upper/lower boundary."]},{"n":2,"lvl":"low","note":"","given":[[{"g":"◆","c":2,"r":2,"k":"","o":0}],[{"g":"◆","c":3,"r":2,"k":"","o":0}],[{"g":"◆","c":4,"r":2,"k":"","o":0}],[{"g":"◆","c":3,"r":2,"k":"","o":0}]],"o1":[[{"g":"◆","c":3,"r":2,"k":"","o":0}],[{"g":"◆","c":2,"r":2,"k":"","o":0}],[{"g":"◆","c":2,"r":1,"k":"","o":0}]],"o2":[[{"g":"◆","c":2,"r":1,"k":"","o":0}],[{"g":"◆","c":1,"r":2,"k":"","o":0}],[{"g":"◆","c":0,"r":2,"k":"","o":0}]],"a1":2,"a2":2,"rules":["◆ moves horizontally one field at a time in row 3 and bounces off the left/right boundary."]},{"n":3,"lvl":"low","note":"","given":[[{"g":"K","c":4,"r":4,"k":"","o":3}],[{"g":"K","c":3,"r":3,"k":"","o":0}],[{"g":"K","c":2,"r":2,"k":"","o":1}],[{"g":"K","c":1,"r":1,"k":"","o":2}]],"o1":[[{"g":"K","c":0,"r":1,"k":"","o":3}],[{"g":"K","c":1,"r":0,"k":"","o":3}],[{"g":"K","c":0,"r":0,"k":"","o":3}]],"o2":[[{"g":"K","c":1,"r":1,"k":"","o":3}],[{"g":"K","c":1,"r":1,"k":"","o":0}],[{"g":"K","c":0,"r":0,"k":"","o":0}]],"a1":3,"a2":2,"rules":["└ moves diagonally downwards to the left one field at a time and retraces its path when it meets a bo ""],["","","","",""],["","","E","","A"],["","","","","D"],["A","","D","C","B"]],"t":[1,2],"ans":"B","full":[["B","C","A","D","E"],["D","A","B","E","C"],["C","D","E","B","A"],["E","B","C","A","D"],["A","E","D","C","B"]]},{"n":10,"lvl":"medium","note":"","grid":[["","E","","",""],["","","A","C",""],["C","","","E",""],["D","","E","","A"],["E","","C","",""]],"t":[2,2],"ans":"D","full":[["A","E","B","D","C"],["B","D","A","C","E"],["C","A","D","E","B"],["D","C","E","B","A"],["E","B","C","A","D"]]},{"n":11,"lvl":"medium","note":"","grid":[["D","","","C",""],["","E","","",""],["E","B","A","","C"],["C","","","","E"],["","C","","",""]],"t":[4,0],"ans":"B","full":[["D","A","E","C","B"],["A","E","C","B","D"],["E","B","A","D","C"],["C","D","B","A","E"],["B","C","D","E","A"]]},{"n":12,"lvl":"medium","note":"","grid":[["","B","","D",""],["","A","","",""],["","D","C","",""],["C","","","A",""],["D","","A","E",""]],"t":[0,0],"ans":"A","full":[["A","B","E","D","C"],["B","A","D","C","E"],["E","D","C","B","A"],["C","E","B","A","D"],["D","C","A","E","B"]]},{"n":13,"lvl":"medium","note":"","grid":[["D","E","","","C"],["","","","C",""],["C","","","","D"],["","","","","E"],["","A","","D","B"]],"t":[2,2],"ans":"A","full":[["D","E","B","A","C"],["B","D","E","C","A"],["C","B","A","E","D"],["A","C","D","B","E"],["E","A","C","D","B"]]},{"n":14,"lvl":"medium","note":"","grid":[["","","A","","E"],["","","B","",""],["","A","","D","C"],["","E","","","B"],["","","D","","A"]],"t":[0,1],"ans":"D","full":[["C","D","A","B","E"],["A","C","B","E","D"],["B","A","E","D","C"],["D","E","C","A","B"],["E","B","D","C","A"]]},{"n":15,"lvl":"high","note":"","grid":[["","","","E",""],["","E","D","",""],["","D","C","","E"],["","","","","B"],["C","","","",""]],"t":[1,4],"ans":"A","full":[["D","A","B","E","C"],["B","E","D","C","A"],["A","D","C","B","E"],["E","C","A","D","B"],["C","B","E","A","D"]]},{"n":16,"lvl":"high","note":"","grid":[["","","B","",""],["D","","","C",""],["","","","","E"],["E","D","","","C"],["","B","","",""]],"t":[2,0],"ans":"B","full":[["C","E","B","D","A"],["D","A","E","C","B"],["B","C","D","A","E"],["E","D","A","B","C"],["A","B","C","E","D"]]},{"n":17,"lvl":"high","note":"","grid":[["B","","","C","E"],["","E","","","D"],["","","","",""],["D","","","","B"],["","","","A",""]],"t":[2,1],"ans":"B","full":[["B","A","D","C","E"],["A","E","C","B","D"],["C","B","E","D","A"],["D","C","A","E","B"],["E","D","B","A","C"]]},{"n":18,"lvl":"high","note":"","grid":[["","A","","","C"],["","","","","E"],["","","C","B",""],["E","","","",""],["","","","D","B"]],"t":[2,0],"ans":"D","full":[["B","A","D","E","C"],["C","D","B","A","E"],["D","E","C","B","A"],["E","B","A","C","D"],["A","C","E","D","B"]]},{"n":19,"lvl":"high","note":"","grid":[["","","","",""],["","","","D","E"],["D","","E","","A"],["","","","E","B"],["E","","C","",""]],"t":[1,0],"ans":"A","full":[["B","E","D","A","C"],["A","C","B","D","E"],["D","B","E","C","A"],["C","D","A","E","B"],["E","A","C","B","D"]]},{"n":20,"lvl":"high","note":"","grid":[["","C","","",""],["","","","D",""],["","","","E","A"],["","","E","","C"],["D","A","","",""]],"t":[0,0],"ans":"E","full":[["E","C","A","B","D"],["A","E","C","D","B"],["C","B","D","E","A"],["B","D","E","A","C"],["D","A","B","C","E"]]}],"subject":[{"title":"Testlet 1 — Data Preparation, Missing Values and Scaling","area":"Applied Computer Science · Questions 1–8","stimulus":"<p>Real data arrives dirty, and the choices made while cleaning it are modelling choices in disguise.</p><p><strong>Missing values</strong> are rarely missing at random. Deleting every incomplete row (<em>listwise deletion</em>) is unbiased only when the missingness is unrelated to the data; otherwise it quietly discards a subpopulation. <em>Mean imputation</em> preserves the column mean but shrinks its variance and weakens correlations, because every imputed point sits exactly on the mean. For a strongly skewed column the median is the safer filler; for a categorical column an explicit \"missing\" category often carries real information.</p><p><strong>Scaling</strong> matters whenever an algorithm compares magnitudes. <em>Min-max normalisation</em> maps a column to [0, 1] via (x − min)/(max − min) and is therefore extremely sensitive to a single extreme value. <em>Standardisation</em> maps it to mean 0 and standard deviation 1 via (x − μ)/σ, leaving the shape of the distribution unchanged.</p><p><strong>Encoding</strong> converts categories to numbers. <em>One-hot encoding</em> creates one binary column per category and adds no false ordering; <em>label encoding</em> assigns 0, 1, 2 … and implies an order that usually does not exist. A category with <em>k</em> levels therefore costs <em>k</em> one-hot columns.</p><p>Finally, every parameter learned during preparation — a mean, a σ, a min, a max — must be computed on the <strong>training set only</strong> and then applied unchanged to the test set. Fitting a scaler on the full data set before splitting leaks test information into training.</p>","questions":[{"n":1,"stem":"<p>A column of annual incomes is strongly right-skewed and has 8 % missing values. Which single-column imputation is most defensible?</p>","options":["the mean","the median","zero","the maximum"],"ans":1,"expl":"The median is unaffected by the long right tail, whereas the mean of a skewed income column sits well above the typical value and would push every imputed record upwards."},{"n":2,"stem":"<p>What is the main statistical side effect of mean imputation?</p>","options":["It shifts the column mean upwards.","It reduces the variance of the column and weakens its correlations.","It makes the column categorical.","It has no effect on any statistic."],"ans":1,"expl":"Every imputed point lands exactly on the mean, so the spread of the column shrinks and its correlation with other variables is diluted. The mean itself is preserved — that is the whole appeal, and the trap."},{"n":3,"stem":"<p>A feature has values 10, 20, 30, 40, 50. What is the min-max normalised value of 20?</p>","options":["0.20","0.25","0.40","0.50"],"ans":1,"expl":"(20 − 10)/(50 − 10) = 10/40 = <strong>0.25</strong>."},{"n":4,"stem":"<p>The same feature is standardised. Its mean is 30 and its population standard deviation is √200 ≈ 14.14. What is the standardised value of 50?</p>","options":["1.41","0.71","2.00","1.00"],"ans":0,"expl":"(50 − 30)/14.14 = 20/14.14 ≈ <strong>1.41</strong>."},{"n":5,"stem":"<p>A categorical feature <code>city</code> has 12 distinct values. How many columns does one-hot encoding produce, and what does label encoding wrongly imply?</p>","options":["1 column; nothing is implied","12 columns; label encoding implies an ordering of the cities","12 columns; label encoding implies the cities are missing","144 columns; label encoding implies independence"],"ans":1,"expl":"One binary column per level gives <strong>12</strong> columns. Label encoding would number the cities 0–11 and so assert an ordering (and equal spacing) that does not exist."},{"n":6,"stem":"<p>A <code>StandardScaler</code> is fitted on the entire data set and the data is split into train and test afterwards. What is the problem?</p>","options":["Nothing; this is the recommended order.","The test set's mean and variance influence the training transformation, leaking information and inflating the test score.","The scaler cannot be applied to a test set at all.","The training set becomes too small."],"ans":1,"expl":"The scaler's mean and σ are computed from data that includes the test rows, so test information reaches the training transformation. Fit on train, then apply to test."},{"n":7,"stem":"<p>A single sensor glitch records a temperature of 9 999 °C in an otherwise normal column. Which scaling method is damaged most?</p>","options":["standardisation","min-max normalisation","one-hot encoding","label encoding"],"ans":1,"expl":"Min-max uses the extreme values directly, so a single 9 999 compresses every genuine reading into a tiny interval near 0. Standardisation is disturbed too, but far less violently."},{"n":8,"stem":"<p>Rows with any missing value are deleted, and it later turns out that low-income respondents were the ones most likely to skip the income question. What has happened?</p>","options":["Nothing; listwise deletion is always unbiased.","The remaining sample is biased towards higher incomes.","The variance of income has increased correctly.","The missing values have been imputed implicitly with the mean."],"ans":1,"expl":"Missingness is related to the value itself, so deleting those rows removes low-income respondents preferentially and biases the surviving sample upwards."}]},{"title":"Testlet 2 — Trees, Graphs and Search","area":"Theoretical Computer Science · Questions 9–16","stimulus":"<p>A <strong>tree</strong> is a connected acyclic graph; a tree with <em>n</em> nodes has exactly <em>n</em> − 1 edges. In a <strong>binary tree</strong> every node has at most two children. A binary tree of height <em>h</em> (counting the root as height 0) holds at most 2^(h+1) − 1 nodes, and a <em>balanced</em> tree over <em>n</em> nodes has height Θ(log n).</p><p>A <strong>binary search tree</strong> stores keys so that everything in a node's left subtree is smaller and everything in its right subtree is larger. Lookup costs O(log n) when the tree is balanced but degenerates to O(n) when keys are inserted in sorted order and the tree becomes a chain. An <strong>in-order</strong> traversal of a BST visits the keys in ascending order.</p><p><strong>Depth-first search</strong> follows one branch to its end before backtracking and is naturally implemented with a stack (or recursion); <strong>breadth-first search</strong> explores layer by layer using a queue and therefore finds the path with the fewest edges in an unweighted graph. Both run in O(V + E) on an adjacency list. <strong>Dijkstra's algorithm</strong> finds shortest paths in a graph with non-negative edge weights; negative weights break its correctness because a node's distance may improve after it has been finalised.</p>","questions":[{"n":9,"stem":"<p>A tree has 25 nodes. How many edges does it have?</p>","options":["24","25","26","50"],"ans":0,"expl":"A tree with n nodes has exactly n − 1 edges: <strong>24</strong>."},{"n":10,"stem":"<p>What is the maximum number of nodes in a binary tree of height 3, counting the root as height 0?</p>","options":["8","15","16","7"],"ans":1,"expl":"2^(3+1) − 1 = <strong>15</strong> nodes."},{"n":11,"stem":"<p>Keys are inserted into an initially empty binary search tree in the order 1, 2, 3, …, n. What is the resulting lookup complexity?</p>","options":["O(log n)","O(1)","O(n)","O(n log n)"],"ans":2,"expl":"Sorted insertion produces a right-leaning chain with no branching, so lookup degenerates to a linear scan: <strong>O(n)</strong>. This is the motivation for self-balancing trees."},{"n":12,"stem":"<p>Which traversal of a binary search tree visits the keys in ascending order?</p>","options":["pre-order","in-order","post-order","level-order"],"ans":1,"expl":"In-order traversal (left subtree, node, right subtree) yields ascending keys."},{"n":13,"stem":"<p>Which data structure gives breadth-first search its layer-by-layer behaviour?</p>","options":["a stack","a queue","a priority queue","a hash table"],"ans":1,"expl":"A queue: nodes are dequeued in the order they were discovered, which produces layer-by-layer exploration. A stack would give depth-first behaviour."},{"n":14,"stem":"<p>In an unweighted graph, which algorithm finds a path with the fewest edges?</p>","options":["depth-first search","breadth-first search","in-order traversal","any of them, since all paths are equal"],"ans":1,"expl":"BFS reaches every vertex by a path of minimum edge count in an unweighted graph; DFS gives no such guarantee."},{"n":15,"stem":"<p>Why does Dijkstra's algorithm fail on graphs with negative edge weights?</p>","options":["Because the priority queue cannot store negative numbers.","Because a node's shortest distance may still improve after the node has been finalised.","Because negative weights make the graph disconnected.","Because it only works on trees."],"ans":1,"expl":"Dijkstra finalises a node once it is popped with the smallest tentative distance. A negative edge encountered later could have produced a shorter route, so the finalised value is wrong. Bellman–Ford handles this case."},{"n":16,"stem":"<p>A connected graph has 10 vertices and 9 edges. What must it be?</p>","options":["a tree","a graph containing exactly one cycle","a complete graph","disconnected"],"ans":0,"expl":"Connected with exactly n − 1 = 9 edges is precisely the definition of a tree, so it contains no cycle."}]},{"title":"Testlet 3 — Derivatives and Optimisation","area":"Mathematics · Questions 17–24","stimulus":"<p>Optimisation in data science means finding the parameters that minimise a loss. The tool is the <strong>derivative</strong>: d/dx (xⁿ) = n·xⁿ⁻¹, the derivative of a sum is the sum of the derivatives, and the <strong>chain rule</strong> gives d/dx f(g(x)) = f′(g(x)) · g′(x).</p><p>At a <strong>stationary point</strong> the derivative is zero. The second derivative classifies it: a positive second derivative marks a local minimum, a negative one a local maximum. A function is <strong>convex</strong> when its second derivative is non-negative everywhere, and convexity is what makes optimisation reliable — a convex function has no local minimum other than its global one, so gradient descent cannot get stuck.</p><p>For a function of several variables, the <strong>gradient</strong> ∇f is the vector of partial derivatives; it points in the direction of steepest increase, which is why gradient descent steps in the direction of −∇f. Squared-error loss is convex in the parameters of a linear model, which is why linear regression has a closed-form solution; the loss surface of a deep network is not convex, which is why it does not.</p>","questions":[{"n":17,"stem":"<p>What is the derivative of f(x) = 3x⁴?</p>","options":["12x³","3x³","12x⁴","4x³"],"ans":0,"expl":"d/dx (3x⁴) = 3 · 4x³ = <strong>12x³</strong>."},{"n":18,"stem":"<p>What is the derivative of f(x) = x² − 6x + 5, and where is its stationary point?</p>","options":["2x − 6, stationary at x = 3","2x − 6, stationary at x = 6","2x + 5, stationary at x = 0","x − 6, stationary at x = 6"],"ans":0,"expl":"f′(x) = 2x − 6, which is zero at <strong>x = 3</strong>."},{"n":19,"stem":"<p>Is the stationary point of f(x) = x² − 6x + 5 a minimum or a maximum, and why?</p>","options":["A maximum, because f″(x) = 2 > 0.","A minimum, because f″(x) = 2 > 0.","A minimum, because f′(3) = 0.","It cannot be determined without the graph."],"ans":1,"expl":"f″(x) = 2 &gt; 0 everywhere, so the stationary point is a <strong>minimum</strong> (and the function is convex). Option c gives the right verdict for the wrong reason: f′(3) = 0 only says the point is stationary."},{"n":20,"stem":"<p>Using the chain rule, what is the derivative of f(x) = (2x + 1)³?</p>","options":["3(2x + 1)²","6(2x + 1)²","6x²","2(2x + 1)³"],"ans":1,"expl":"Outer derivative 3(2x + 1)² times inner derivative 2 = <strong>6(2x + 1)²</strong>."},{"n":21,"stem":"<p>For f(x, y) = x² + 3xy, what is the partial derivative with respect to x?</p>","options":["2x + 3y","2x + 3x","3y","2x"],"ans":0,"expl":"Treat y as a constant: ∂f/∂x = <strong>2x + 3y</strong>."},{"n":22,"stem":"<p>Why does gradient descent step in the direction of the <strong>negative</strong> gradient?</p>","options":["Because the gradient points towards the steepest increase of the function.","Because the gradient is always negative.","Because the negative gradient is easier to compute.","Because it guarantees a global minimum for any function."],"ans":0,"expl":"The gradient points towards steepest <em>increase</em>, so minimising means moving against it. Option d is false: descent guarantees nothing globally on a non-convex surface."},{"n":23,"stem":"<p>Which property of a loss function guarantees that any local minimum is also the global minimum?</p>","options":["continuity","differentiability","convexity","symmetry"],"ans":2,"expl":"<strong>Convexity</strong>. This is exactly why linear and logistic regression are reliable and deep networks are not."},{"n":24,"stem":"<p>Which statement about the loss surface of a deep neural network is correct?</p>","options":["It is convex, so gradient descent always reaches the global minimum.","It is generally non-convex, so gradient descent may settle in a local minimum or saddle region.","It has no gradient.","It has exactly two minima."],"ans":1,"expl":"Deep networks have highly non-convex loss surfaces with many saddle points; in practice good solutions are still found, but no global guarantee exists."}]},{"title":"Testlet 4 — Classification Models","area":"Applied Computer Science · Questions 25–32","stimulus":"<p>A <strong>decision tree</strong> splits the data recursively on one feature at a time, choosing the split that most reduces an impurity measure such as Gini or entropy. Grown without limit it reaches pure leaves and memorises the training set, so depth limits and pruning are essential. Trees are invariant to monotone rescaling of features, which is why they need no standardisation.</p><p><strong>k-nearest neighbours</strong> stores the training set and classifies a new point by majority vote among its <em>k</em> closest neighbours. There is no training phase — all the cost is at prediction time — and because it relies on distances it is highly sensitive to feature scale. Small <em>k</em> gives a jagged, high-variance boundary; large <em>k</em> smooths the boundary and increases bias.</p><p><strong>Naive Bayes</strong> applies Bayes' theorem while assuming that the features are conditionally independent given the class. The assumption is almost always false, yet the classifier works remarkably well on high-dimensional text, where it is fast and needs little data.</p><p><strong>Logistic regression</strong> models the log-odds of the positive class as a linear function of the features and passes the result through the sigmoid to obtain a probability. Choosing a decision threshold other than 0.5 trades precision against recall; the <strong>ROC curve</strong> plots this trade-off across all thresholds, and the area under it (AUC) summarises ranking quality independently of any single threshold.</p>","questions":[{"n":25,"stem":"<p>A decision tree is grown to unlimited depth on the training data. What is the most likely outcome?</p>","options":["It underfits.","It reaches near-perfect training accuracy and overfits.","It becomes equivalent to logistic regression.","It fails to converge."],"ans":1,"expl":"An unrestricted tree keeps splitting until every leaf is pure, memorising the training data including its noise."},{"n":26,"stem":"<p>Which model requires no training phase, doing all of its work at prediction time?</p>","options":["decision tree","k-nearest neighbours","logistic regression","naive Bayes"],"ans":1,"expl":"kNN is a lazy learner: it simply stores the training set and does all the work when a query arrives, which is why prediction is slow on large data."},{"n":27,"stem":"<p>In k-nearest neighbours, what is the effect of increasing <em>k</em> from 1 to 50?</p>","options":["Variance increases and bias decreases.","The decision boundary becomes smoother: bias increases and variance decreases.","Nothing changes as long as the data is standardised.","The model becomes a decision tree."],"ans":1,"expl":"Larger <em>k</em> averages over more neighbours, smoothing the boundary — the classic bias–variance trade: bias up, variance down."},{"n":28,"stem":"<p>What is the \"naive\" assumption in naive Bayes?</p>","options":["That every class is equally likely.","That the features are conditionally independent given the class.","That the data is normally distributed.","That the classes are linearly separable."],"ans":1,"expl":"Conditional independence of the features given the class. It is usually false, yet the classifier remains competitive because only the <em>ranking</em> of class probabilities has to be right."},{"n":29,"stem":"<p>Which model needs <strong>no</strong> feature standardisation?</p>","options":["k-nearest neighbours","a decision tree","k-means clustering","a neural network"],"ans":1,"expl":"Trees split one feature at a time at a threshold, so any monotone rescaling leaves the splits unchanged. The other three all depend on distances or weighted sums."},{"n":30,"stem":"<p>A logistic regression outputs 0.62 for a case. What does this number represent?</p>","options":["The estimated probability that the case belongs to the positive class.","The distance to the decision boundary.","The log-odds of the positive class.","The model's accuracy on that case."],"ans":0,"expl":"The sigmoid output is the estimated probability of the positive class. The log-odds is the value <em>before</em> the sigmoid."},{"n":31,"stem":"<p>The decision threshold of a classifier is lowered from 0.5 to 0.3. What is the expected effect?</p>","options":["Recall rises and precision usually falls.","Precision rises and recall falls.","Both rise.","Neither changes; only accuracy changes."],"ans":0,"expl":"A lower threshold predicts positive more often, catching more true positives (recall up) at the cost of more false positives (precision down)."},{"n":32,"stem":"<p>What does an ROC-AUC of 0.5 indicate?</p>","options":["Perfect classification.","Performance no better than random ranking.","That half the predictions are correct by construction.","That the model is perfectly calibrated."],"ans":1,"expl":"AUC 0.5 is the diagonal of the ROC curve: the model ranks positives above negatives no better than chance."}]},{"title":"Testlet 5 — Correlation and Time Series","area":"Mathematics · Questions 33–40","stimulus":"<p>The <strong>Pearson correlation coefficient</strong> <em>r</em> measures the strength of the <em>linear</em> association between two variables and lies in [−1, 1]. It is symmetric, unitless, and r² is the proportion of variance shared. Two facts constrain its use. First, a coefficient near zero rules out a linear relationship but not a curved one: y = x² over a symmetric range gives r ≈ 0 despite perfect dependence. Second, <strong>correlation is not causation</strong> — a third, <em>confounding</em> variable can produce a strong association between two variables that influence each other not at all.</p><p>A <strong>time series</strong> is a sequence of observations indexed by time, usually decomposed into trend, seasonality and a remainder. It is <strong>stationary</strong> when its mean, variance and autocovariance do not depend on time; most forecasting methods assume stationarity, and <strong>differencing</strong> (replacing each value by its change from the previous one) is the standard way to remove a trend. <strong>Autocorrelation</strong> is the correlation of a series with its own lagged copy, so a strongly seasonal monthly series shows a peak at lag 12.</p><p>Time series break the usual validation rules. Rows are not exchangeable, so a random train/test split lets the model learn from the future to predict the past. Splits must respect chronology, and validation must roll forward in time.</p>","questions":[{"n":33,"stem":"<p>Two variables have r = −0.9. What does this indicate?</p>","options":["A strong negative linear relationship.","A weak relationship, because the sign is negative.","That one variable causes the other to decrease.","That 90 % of the points lie on a straight line."],"ans":0,"expl":"r near −1 means a strong <em>linear</em> association in which y falls as x rises. It says nothing about causation, and it is not a percentage of points on a line."},{"n":34,"stem":"<p>For data lying exactly on the parabola y = x² with x symmetric about 0, what is the approximate Pearson correlation?</p>","options":["1","−1","0","0.5"],"ans":2,"expl":"Over a range symmetric about zero the parabola rises on one side and falls on the other, so the <em>linear</em> correlation cancels to ≈ <strong>0</strong> even though the dependence is perfect. Pearson r only sees straight lines."},{"n":35,"stem":"<p>Ice-cream sales and drowning deaths are strongly correlated across the year. What is the most likely explanation?</p>","options":["Ice cream causes drowning.","Drowning causes ice-cream sales.","A confounder — hot weather — drives both.","The correlation must be a calculation error."],"ans":2,"expl":"Hot weather drives both. This is the standard illustration of a confounder."},{"n":36,"stem":"<p>A regression reports r = 0.6. What proportion of the variance in y is explained?</p>","options":["60 %","36 %","77 %","6 %"],"ans":1,"expl":"r² = 0.6² = 0.36 → <strong>36 %</strong>."},{"n":37,"stem":"<p>What does it mean for a time series to be stationary?</p>","options":["Its values never change.","Its mean, variance and autocovariance do not depend on time.","It has no seasonality but may have a trend.","All of its values are positive."],"ans":1,"expl":"Stationarity is about the <em>distributional</em> properties being time-invariant, not about the values being constant. A trend violates it, which is why differencing comes first."},{"n":38,"stem":"<p>A monthly series has a clear yearly seasonal cycle. At which lag would you expect the strongest autocorrelation?</p>","options":["1","4","12","365"],"ans":2,"expl":"A yearly cycle in monthly data repeats every <strong>12</strong> observations."},{"n":39,"stem":"<p>What is the standard first step for removing a linear trend from a time series?</p>","options":["taking first differences","standardising the values","sorting the values","removing the largest value"],"ans":0,"expl":"First differencing (yₜ − yₜ₋₁) removes a linear trend and is the standard starting point."},{"n":40,"stem":"<p>Why is a random train/test split inappropriate for a forecasting problem?</p>","options":["Because random splits always produce unbalanced classes.","Because training rows drawn from after the test period let the model use future information, inflating the score.","Because time series cannot be split at all.","Because the test set must always be larger than the training set."],"ans":1,"expl":"Random splitting scatters future observations into the training set, so the model is evaluated on a task it could never face in production. Use a chronological split and rolling-origin validation."}]}]},{"id":5,"fs":[{"n":1,"lvl":"low","note":"","given":[[{"g":"■","c":4,"r":0,"k":"","o":0}],[{"g":"■","c":3,"r":0,"k":"","o":0}],[{"g":"■","c":2,"r":0,"k":"","o":0}],[{"g":"■","c":1,"r":0,"k":"","o":0}]],"o1":[[{"g":"■","c":1,"r":1,"k":"","o":0}],[{"g":"■","c":0,"r":1,"k":"","o":0}],[{"g":"■","c":0,"r":0,"k":"","o":0}]],"o2":[[{"g":"■","c":0,"r":1,"k":"","o":0}],[{"g":"■","c":2,"r":0,"k":"","o":0}],[{"g":"■","c":1,"r":0,"k":"","o":0}]],"a1":3,"a2":3,"rules":["■ moves horizontally one field at a time in row 1 and bounces off the left/right boundary."]},{"n":2,"lvl":"low","note":"","given":[[{"g":"■","c":4,"r":3,"k":"","o":0}],[{"g":"■","c":4,"r":2,"k":"","o":0}],[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":4,"r":0,"k":"","o":0}]],"o1":[[{"g":"■","c":3,"r":0,"k":"","o":0}],[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":3,"r":2,"k":"","o":0}]],"o2":[[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":3,"r":2,"k":"","o":0}],[{"g":"■","c":4,"r":2,"k":"","o":0}]],"a1":2,"a2":3,"rules":["■ moves vertically one field at a time in column ε and bounces off the upper/lower boundary."]},{"n":3,"lvl":"low","note":"","given":[[{"g":"○","c":2,"r":0,"k":"","o":0}],[{"g":"○","c":1,"r":0,"k":"","o":0}],[{"g":"○","c":0,"r":0,"k":"","o":0}],[{"g":"○","c":1,"r":0,"k":"","o":0}]],"o1":[[{"g":"○","c":3,"r":1,"k":"","o":0}],[{"g":"○","c":2,"r":0,"k":"","o":0}],[{"g":"○","c":2,"r":1,"k":"","o":0}]],"o2":[[{"g":"○","c":2,"r":0,"k":"","o":0}],[{"g":"○","c":4,"r":1,"k":"","o":0}],[{"g":"○","c":3,"r":0,"k":"","o":0}]],"a1":2,"a2":3,"rules":["○ moves horizontally one field at a time in row 1 and bounces off the left/right boundary."]},{"n":4,"lvl":"low","note":"","given":[[{"g":"■","c":4,"r":4,"k":"","o":0}],[{"g":"■","c":4,"r":3,"k":"","o":0}],[{"g":"■","c":4,"r":2,"k":"","o":0}],[{"g":"■","c":4,"r":1,"k":"","o":0}]],"o1":[[{"g":"■","c":3,"r":1,"k":"","o":0}],[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":4,"r":0,"k":"","o":0}]],"o2":[[{"g":"■","c":4,"r":2,"k":"","o":0}],[{"g":"■","c":4,"r":1,"k":"","o":0}],[{"g":"■","c":4,"r":0,"k":"","o":0}]],"a1":3,"a2":2,"rules":["■ moves vertically one field at a time in column ε and bounces off the upper/lower boundary."]},{"n":5,"lvl":"low","note":"","given":[[{"g":"A","c":4,"r":0,"k":"","o":1}],[{"g":"A","c":4,"r":1,"k":"","o":2}],[{"g":"A","c":4,"r":2,"k":"","o":3}],[{"g":"A","c":4,"r":3,"k":"","o":0}]],"o1":[[{"g":"A","c":3,"r":4,"k":"","o":1}],[{"g":"A","c":4,"r":3,"k":"","o":1}],[{"g":"A","c":4,"r":4,"k":"","o":1}]],"o2":[[{"g":"A","c":4,"r":4,"k":"","o":2}],[{"g":"A","c":4,"r":3,"k":"","o":2}],[{"g":"A","c":4,"r":3,"k":"","o":0}]],"a1":3,"a2":2,"rules":["→ moves vertically one field at a time in column ε and bounces off the upper/lower boundary; it rotates 90° to the right from image to image."]},{"n":6,"lvl":"low","note":"","given":[[{"g":"K","c":2,"r":2,"k":"","o":3}],[{"g":"K","c":3,"r":3,"k":"","o":2}],[{"g":"K","c":4,"r":4,"k":"","o":1}],[{"g":"K","c":3,"r":3,"k":"","o":0}]],"o1":[[{"g":"K","c":2,"r":2,"k":"","o":3}],[{"g":"K","c":1,"r":1,"k":"","o":3}],[{"g":"K","c":2,"r":2,"k":"","o":1}]],"o2":[[{"g":"K","c":0,"r":2,"k":"","o":2}],[{"g":"K","c":2,"r":0,"k":"","o":2}],[{"g":"K","c":1,"r":1,"k":"","o":2}]],"a1":1,"a2":3,"rules":["└ moves diagonally downwards to the right one field at a time and retraces its path when it meets a boundary; it rotates 90° to the left from image to image."]},{"n":7,"lvl":"low","note":"","given":[[{"g":"◆","c":1,"r":0,"k":"","o":0}],[{"g":"◆","c":0,"r":0,"k":"","o":0}],[{"g":"◆","c":1,"r":0," than speed. A sort is <strong>stable</strong> when equal keys keep their original relative order, which matters when sorting by one column after another. Merge sort is stable and O(n log n) in every case but needs O(n) extra space; heapsort is O(n log n) in place but unstable; quicksort is fast in practice yet quadratic in the worst case. No comparison-based sort can beat <strong>Ω(n log n)</strong>, because a decision tree distinguishing n! orderings must have depth at least log₂(n!) ≈ n log n. Counting sort escapes this bound only by abandoning comparisons.</p><p>Finally, O-notation describes growth, not wall-clock time: an O(n log n) algorithm with a huge constant can lose to an O(n²) algorithm on small inputs, which is why real implementations switch to insertion sort below a threshold.</p>","questions":[{"n":1,"stem":"<p>Which recurrence describes merge sort?</p>","options":["T(n) = T(n/2) + O(1)","T(n) = 2T(n/2) + O(n)","T(n) = 2T(n − 1) + O(1)","T(n) = T(n − 1) + O(n)"],"ans":1,"expl":"Merge sort splits into two halves and merges them in linear time: T(n) = 2T(n/2) + O(n)."},{"n":2,"stem":"<p>Solve T(n) = 2T(n/2) + O(n).</p>","options":["O(n)","O(n log n)","O(n²)","O(log n)"],"ans":1,"expl":"a = 2, b = 2, d = 1 and log₂ 2 = 1 = d, so the balanced case applies: <strong>O(n log n)</strong>."},{"n":3,"stem":"<p>Solve T(n) = T(n/2) + O(1).</p>","options":["O(1)","O(log n)","O(n)","O(n log n)"],"ans":1,"expl":"a = 1, b = 2, d = 0 and log₂ 1 = 0 = d, giving <strong>O(log n)</strong> — binary search."},{"n":4,"stem":"<p>What is the lower bound for any comparison-based sorting algorithm?</p>","options":["Ω(n)","Ω(n log n)","Ω(n²)","Ω(log n)"],"ans":1,"expl":"A decision tree separating n! orderings needs depth ≥ log₂(n!) ≈ n log n, so <strong>Ω(n log n)</strong> is unavoidable for comparison-based sorting. Counting and radix sort beat it only by not comparing."},{"n":5,"stem":"<p>Which sorting algorithm is stable <strong>and</strong> guarantees O(n log n) in the worst case?</p>","options":["quicksort","heapsort","merge sort","selection sort"],"ans":2,"expl":"Merge sort is stable and O(n log n) in every case. Quicksort is O(n²) in the worst case, heapsort is unstable, selection sort is O(n²)."},{"n":6,"stem":"<p>What does it mean for a sort to be <em>stable</em>?</p>","options":["It never crashes on large inputs.","Records with equal keys keep their original relative order.","Its running time does not depend on the input order.","It sorts in place."],"ans":1,"expl":"Stability preserves the relative order of equal keys, which is what makes successive sorts on different columns compose correctly."},{"n":7,"stem":"<p>Algorithm A runs in O(n log n) with a very large constant; algorithm B runs in O(n²) with a tiny constant. For n = 20, which is likely faster?</p>","options":["A, because its complexity class is lower.","B, because constants dominate at small n.","They are necessarily identical.","The question cannot be answered because O-notation forbids comparison."],"ans":1,"expl":"At n = 20 the asymptotic advantage of A is worth little and its large constant dominates. This is why real libraries fall back to insertion sort on small subarrays."},{"n":8,"stem":"<p>An algorithm performs 3n² + 500n + 20 000 operations. In which class does it lie?</p>","options":["O(n)","O(n log n)","O(n²)","O(n³)"],"ans":2,"expl":"Only the fastest-growing term matters, and constants are dropped: <strong>O(n²)</strong>."}]},{"title":"Testlet 2 — Matrix Decompositions and the Mathematics of PCA","area":"Mathematics · Questions 9–16","stimulus":"<p>A square matrix with a full set of independent eigenvectors can be written as A = V Λ V⁻¹, where Λ is diagonal and holds the eigenvalues. For a <strong>symmetric</strong> matrix the eigenvectors can always be chosen orthonormal, so A = V Λ Vᵀ — the <em>spectral</em> decomposition. Two identities are worth memorising: the <strong>trace</strong> equals the sum of the eigenvalues and the <strong>determinant</strong> equals their product.</p><p>PCA is this decomposition applied to the <strong>covariance matrix</strong> of centred data. The covariance matrix of <em>p</em> features is p × p, symmetric and positive semi-definite, so all its eigenvalues are real and non-negative. Its eigenvectors are the principal components and its eigenvalues are the variances along them; the <strong>explained variance ratio</strong> of component <em>i</em> is λᵢ divided by the sum of all eigenvalues, which also equals the trace. Centring the data is mandatory — without it the first component points at the mean rather than at the direction of greatest spread.</p><p>The <strong>singular value decomposition</strong> A = U Σ Vᵀ generalises this to any m × n matrix. The singular values on the diagonal of Σ are non-negative, the number of non-zero ones equals the <strong>rank</strong> of A, and truncating Σ to its largest <em>k</em> values yields the best possible rank-<em>k</em> approximation of A in the least-squares sense — the result behind both PCA and low-rank compression.</p><p><em>Questions 9–12 refer to the covariance matrix</em> C <em>of a 3-feature data set, whose eigenvalues are 6, 3 and 1.</em></p>","questions":[{"n":9,"stem":"<p>What is the trace of C?</p>","options":["6","10","18","3"],"ans":1,"expl":"The trace equals the sum of the eigenvalues: 6 + 3 + 1 = <strong>10</strong>."},{"n":10,"stem":"<p>What is the determinant of C?</p>","options":["10","18","6","0"],"ans":1,"expl":"The determinant equals their product: 6 · 3 · 1 = <strong>18</strong>."},{"n":11,"stem":"<p>What proportion of the total variance does the first principal component explain?</p>","options":["60 %","33 %","90 %","50 %"],"ans":0,"expl":"6/10 = <strong>60 %</strong>."},{"n":12,"stem":"<p>How many components must be kept to explain at least 85 % of the variance?</p>","options":["1","2","3","none, the threshold is unreachable"],"ans":1,"expl":"One component gives 60 %; two give (6 + 3)/10 = 90 %, which clears 85 %. So <strong>2</strong> components."},{"n":13,"stem":"<p>A data set has 500 observations and 8 features. What is the size of its covariance matrix?</p>","options":["500 × 500","8 × 8","500 × 8","8 × 500"],"ans":1,"expl":"The covariance matrix is p × p in the number of <em>features</em>, not observations: <strong>8 × 8</strong>."},{"n":14,"stem":"<p>Why must the data be centred before PCA?</p>","options":["Otherwise the eigenvalues become negative.","Otherwise the first component is dominated by the offset of the mean from the origin rather than by the direction of greatest variance.","Otherwise the covariance matrix is not square.","Centring is optional and has no effect."],"ans":1,"expl":"Without centring, the first component aligns with the vector from the origin to the data's mean, which usually has nothing to do with the direction of maximum spread."},{"n":15,"stem":"<p>In the SVD A = U Σ Vᵀ, what does the number of non-zero singular values equal?</p>","options":["the rank of A","the number of rows of A","the determinant of A","the trace of A"],"ans":0,"expl":"The count of non-zero singular values is exactly the <strong>rank</strong> of A."},{"n":16,"stem":"<p>Which statement about the eigenvalues of a covariance matrix is true?</p>","options":["They may be any real number, positive or negative.","They are always real and non-negative, because the matrix is symmetric positive semi-definite.","They are always strictly positive, never zero.","They are always complex."],"ans":1,"expl":"A covariance matrix is symmetric and positive semi-definite, so its eigenvalues are real and ≥ 0. They can be exactly zero when features are linearly dependent, which is why option c is wrong."}]},{"title":"Testlet 3 — Hypothesis Testing and Confidence Intervals","area":"Mathematics · Questions 17–24","stimulus":"<p>A hypothesis test starts from a <strong>null hypothesis</strong> H₀ — normally \"no effect\" — and asks how surprising the observed data would be if H₀ were true. The <strong>p-value</strong> is the probability of obtaining a result at least as extreme as the one observed, <em>assuming H₀ is true</em>. It is therefore a statement about the data given the hypothesis, never about the probability that the hypothesis is true.</p><p>If the p-value falls below the <strong>significance level</strong> α, H₀ is rejected. Two errors are possible: a <strong>Type I error</strong> rejects a true H₀ (its probability is α), and a <strong>Type II error</strong> fails to reject a false H₀ (its probability is β). The <strong>power</strong> of a test, 1 − β, is its chance of detecting a real effect; power rises with the sample size and with the size of the effect, and lowering α reduces Type I errors at the cost of power.</p><p>A <strong>confidence interval</strong> gives the range of parameter values compatible with the data. A 95 % interval is constructed so that, over repeated sampling, 95 % of such intervals would contain the true parameter. Its width shrinks with √n, so quadrupling the sample halves it. A 95 % interval for a difference that excludes zero corresponds to a two-sided test rejecting at α = 0.05.</p><p>Two cautions. <strong>Statistical significance is not practical importance</strong>: with a large enough sample, a trivial effect becomes significant. And testing many hypotheses inflates the false-positive count — at α = 0.05, 20 independent tests on pure noise produce about one \"significant\" result by construction.</p>","questions":[{"n":17,"stem":"<p>What exactly does a p-value of 0.03 mean?</p>","options":["There is a 3 % probability that the null hypothesis is true.","If the null hypothesis were true, data at least this extreme would occur about 3 % of the time.","There is a 97 % probability that the alternative hypothesis is true.","The effect explains 3 % of the variance."],"ans":1,"expl":"The p-value is P(data at least this extreme | H₀ true). Options a and c invert the conditioning — the single most common misreading in applied statistics."},{"n":18,"stem":"<p>A true null hypothesis is rejected. Which error has occurred?</p>","options":["Type I","Type II","no error","a sampling error"],"ans":0,"expl":"Rejecting a true null is a <strong>Type I</strong> error, whose long-run rate is α."},{"n":19,"stem":"<p>A test has power 0.80. What is the probability of a Type II error?</p>","options":["0.05","0.20","0.80","0.95"],"ans":1,"expl":"Power = 1 − β, so β = 1 − 0.80 = <strong>0.20</strong>."},{"n":20,"stem":"<p>Which change increases the power of a test?</p>","options":["reducing the sample size","increasing the sample size","lowering α from 0.05 to 0.01","increasing the variance of the population"],"ans":1,"expl":"Power rises with sample size (and with effect size, and with lower variance). Lowering α <em>reduces</em> power, which is the trade being made."},{"n":21,"stem":"<p>A 95 % confidence interval for a mean difference is [1.2, 4.8]. What follows for the two-sided test at α = 0.05?</p>","options":["H₀ (no difference) is rejected, because the interval excludes zero.","H₀ is not rejected, because the interval is entirely positive.","Nothing; intervals and tests are unrelated.","The p-value must be exactly 0.05."],"ans":0,"expl":"A 95 % interval excluding zero is equivalent to rejecting the two-sided null at α = 0.05. The p-value is below 0.05, not necessarily equal to it."},{"n":22,"stem":"<p>The sample size is multiplied by 4. What happens to the width of the confidence interval, all else equal?</p>","options":["It halves.","It quarters.","It doubles.","It is unchanged."],"ans":0,"expl":"Width scales with 1/√n, so four times the data gives half the width."},{"n":23,"stem":"<p>Twenty independent tests are run at α = 0.05 on data containing no real effect. How many \"significant\" results should be expected?</p>","options":["0","about 1","about 5","20"],"ans":1,"expl":"20 × 0.05 = <strong>1</strong> expected false positive. This is the multiple-comparisons problem, and the reason for Bonferroni or FDR corrections."},{"n":24,"stem":"<p>A study with n = 500 000 finds a difference of 0.01 % with p &lt; 0.001. What is the correct interpretation?</p>","options":["The effect is large and important.","The effect is statistically significant but almost certainly of no practical importance.","The p-value must be wrong.","The null hypothesis is proven false with certainty."],"ans":1,"expl":"With half a million observations even a negligible difference clears any significance threshold. Significance answers \"is it distinguishable from zero\", not \"does it matter\"."}]},{"title":"Testlet 4 — Text Data and NLP Fundamentals","area":"Applied Computer Science · Questions 25–32","stimulus":"<p>Turning text into numbers begins with <strong>tokenisation</strong>, which splits a string into units, and normalisation steps such as lower-casing, <strong>stemming</strong> (chopping to a crude root: <em>studies</em> → <em>studi</em>) and <strong>lemmatisation</strong> (mapping to a real dictionary form: <em>studies</em> → <em>study</em>).</p><p>The <strong>bag-of-words</strong> model represents a document as a vector of term counts over the vocabulary. It discards word order entirely, so <em>\"the dog bit the man\"</em> and <em>\"the man bit the dog\"</em> receive identical vectors; <strong>n-grams</strong> restore a little local order at the cost of a much larger vocabulary. Because common words like <em>the</em> appear everywhere, counts are usually reweighted by <strong>TF-IDF</strong>: the term frequency is multiplied by the inverse document frequency log(N / dfₜ), so a term appearing in <em>every</em> document gets an IDF of log 1 = 0 and is effectively deleted.</p><p>These vectors are sparse and enormous — one dimension per vocabulary item — and they treat <em>car</em> and <em>automobile</em> as unrelated. <strong>Word embeddings</strong> instead place each word in a dense vector space of a few hundred dimensions where distance reflects distributional similarity. Similarity between documents or embeddings is measured with <strong>cosine similarity</strong>, since raw length reflects document size rather than content.</p>","questions":[{"n":25,"stem":"<p>Which statement about the bag-of-words representation is correct?</p>","options":["It preserves the order of the words.","It discards word order, so sentences with the same words in a different order are identical.","It only works for documents of equal length.","It requires embeddings to be trained first."],"ans":1,"expl":"Bag-of-words is order-blind: <em>\"the dog bit the man\"</em> and <em>\"the man bit the dog\"</em> produce identical vectors."},{"n":26,"stem":"<p>A corpus has 1 000 documents and a term appears in all 1 000. What is its IDF using log(N / df)?</p>","options":["0","1","log 1000","1000"],"ans":0,"expl":"IDF = log(1000/1000) = log 1 = <strong>0</strong>."},{"n":27,"stem":"<p>What is the practical consequence of that IDF value?</p>","options":["The term dominates every document vector.","The term contributes nothing and is effectively removed.","The term is treated as a stop word only if it is short.","The document vectors become dense."],"ans":1,"expl":"A zero IDF multiplies the term frequency to zero, so a term occurring in every document contributes nothing — TF-IDF removes ubiquitous words automatically, without a stop-word list."},{"n":28,"stem":"<p>What distinguishes lemmatisation from stemming?</p>","options":["Lemmatisation maps a word to a valid dictionary form; stemming truncates to a crude root that need not be a real word.","Stemming is always more accurate.","Lemmatisation only works on English.","They are two names for the same operation."],"ans":0,"expl":"Lemmatisation uses vocabulary and morphology to produce a real dictionary form; stemming applies crude suffix-stripping rules and can produce non-words."},{"n":29,"stem":"<p>A vocabulary of 50 000 words is used with bigrams added. What is the main consequence?</p>","options":["The feature space shrinks.","The feature space grows enormously and becomes sparser, but some local word order is captured.","Word order is fully preserved.","TF-IDF can no longer be applied."],"ans":1,"expl":"Adding bigrams multiplies the feature space and increases sparsity, but captures short-range order such as <em>\"not good\"</em>."},{"n":30,"stem":"<p>Why is cosine similarity preferred over Euclidean distance for comparing document vectors?</p>","options":["Because it is faster to compute in every case.","Because it ignores vector magnitude, so a long and a short document on the same topic still count as similar.","Because it can only return positive values.","Because Euclidean distance is undefined for sparse vectors."],"ans":1,"expl":"Cosine normalises away magnitude, so document length does not masquerade as dissimilarity."},{"n":31,"stem":"<p>What is the key advantage of dense word embeddings over one-hot vectors?</p>","options":["They are longer, so they store more words.","Semantically related words lie close together, so the representation generalises across synonyms.","They require no training data.","They preserve the exact spelling of each word."],"ans":1,"expl":"Embeddings place distributionally similar words close together, so a model can generalise from <em>car</em> to <em>automobile</em>. One-hot vectors are equidistant and share nothing."},{"n":32,"stem":"<p>A document contains 200 tokens, of which the word <em>model</em> occurs 6 times. What is its term frequency, using raw count divided by document length?</p>","options":["6","0.03","0.06","0.006"],"ans":1,"expl":"6/200 = <strong>0.03</strong>."}]},{"title":"Testlet 5 — Clustering and Unsupervised Evaluation","area":"Applied Computer Science · Questions 33–40","stimulus":"<p><strong>k-means</strong> partitions data into <em>k</em> clusters by alternating two steps: assign every point to its nearest centroid, then recompute each centroid as the mean of the points assigned to it. The procedure always converges, but only to a <em>local</em> optimum, so the result depends on the initial centroids — hence k-means++ initialisation and multiple restarts. Because the objective is squared Euclidean distance, k-means finds roughly spherical clusters of similar size and is sensitive to feature scale and to outliers.</p><p>The number of clusters must be chosen in advance. The <strong>elbow method</strong> plots the within-cluster sum of squares against <em>k</em> and looks for the bend; the sum of squares always falls as <em>k</em> rises, reaching zero when k equals the number of points, so it cannot be minimised naively. The <strong>silhouette coefficient</strong> compares, for each point, its mean distance to its own cluster with its mean distance to the nearest other cluster; it ranges from −1 to 1, and values near 1 indicate well-separated clusters.</p><p><strong>Hierarchical clustering</strong> builds a nested tree of clusters and needs no <em>k</em> up front — the dendrogram is cut at whatever height is wanted. <strong>DBSCAN</strong> groups points by density, which lets it find arbitrarily shaped clusters and label sparse points as noise, but it needs a distance threshold and struggles when densities vary.</p><p>Evaluation without labels is intrinsically harder: internal measures like silhouette judge geometry, not meaning, so a high score does not guarantee that the clusters correspond to anything the domain cares about.</p>","questions":[{"n":33,"stem":"<p>Which two steps does k-means alternate?</p>","options":["Splitting and merging clusters.","Assigning points to the nearest centroid, then recomputing centroids as cluster means.","Computing eigenvalues, then projecting.","Sorting points, then thresholding."],"ans":1,"expl":"Assignment to nearest centroid, then recomputation of centroids as the means of their assigned points, repeated to convergence."},{"n":34,"stem":"<p>Why can two runs of k-means on identical data give different results?</p>","options":["Because the algorithm is non-deterministic in its distance calculation.","Because it converges to a local optimum that depends on the initial centroids.","Because the data changes between runs.","They cannot; k-means is always deterministic."],"ans":1,"expl":"The objective is non-convex, so the algorithm converges to a local optimum whose identity depends on initialisation. Hence k-means++ and multiple restarts."},{"n":35,"stem":"<p>Why can the within-cluster sum of squares not be used to choose <em>k</em> by minimising it?</p>","options":["Because it is undefined for k > 2.","Because it decreases monotonically with k and reaches zero when k equals the number of points.","Because it increases with k.","Because it requires labels."],"ans":1,"expl":"WCSS falls monotonically as k rises and hits zero when every point is its own cluster, so minimising it just returns k = n. That is why the <em>elbow</em> is sought rather than the minimum."},{"n":36,"stem":"<p>A clustering has an average silhouette coefficient of 0.72. What does this suggest?</p>","options":["Poorly separated, overlapping clusters.","Reasonably well-separated, cohesive clusters.","That exactly 72 % of points are correctly clustered.","That k was chosen too small."],"ans":1,"expl":"Silhouette runs from −1 to 1; 0.72 indicates points sit much closer to their own cluster than to the nearest other one."},{"n":37,"stem":"<p>Which clustering method does <strong>not</strong> require the number of clusters to be fixed in advance?</p>","options":["k-means","k-medoids","hierarchical clustering","Gaussian mixtures with fixed k"],"ans":2,"expl":"Hierarchical clustering produces a dendrogram that can be cut at any height, so k is chosen after the fact."},{"n":38,"stem":"<p>A data set contains two long, interleaved crescent shapes. Which method is most likely to recover them?</p>","options":["k-means with k = 2","DBSCAN","k-means with k = 10","none; the shapes cannot be clustered"],"ans":1,"expl":"DBSCAN groups by density and so recovers arbitrarily shaped clusters. k-means imposes spherical, roughly equal-sized partitions and slices the crescents in half."},{"n":39,"stem":"<p>Which statement about k-means and feature scaling is correct?</p>","options":["k-means is scale-invariant, so scaling is unnecessary.","k-means uses Euclidean distance, so an unscaled large-range feature dominates the clustering.","Scaling changes only the running time.","Only hierarchical clustering is affected by scale."],"ans":1,"expl":"Euclidean distance means the feature with the largest numeric range dominates the objective, so standardisation is effectively mandatory."},{"n":40,"stem":"<p>A clustering achieves an excellent silhouette score but the clusters make no sense to domain experts. What is the correct conclusion?</p>","options":["The experts are mistaken, because the metric is objective.","Internal metrics measure geometric separation, not meaning; the clustering may be well-formed yet useless.","The silhouette score must have been computed incorrectly.","The data must be re-scaled until the score falls."],"ans":1,"expl":"Silhouette measures geometry only. A clustering can be perfectly well-separated in feature space and still carve the data along axes the domain does not care about — which is why unsupervised results always need a substantive check."}]}]}]
