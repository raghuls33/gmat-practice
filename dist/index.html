<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMAT Practice Suite — Data Science</title>
<style>
:root{
  --crimson:#A5195B; --crimson-l:#B4497E; --crimson-bg:#FBF3F7;
  --ink:#1c1c1e; --muted:#6b6b70; --line:#e2e2e6; --bg:#f6f6f8; --card:#fff;
  --ok:#1E8A3C; --bad:#D0021B; --warn:#E8720C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
code,pre{font-family:"SF Mono",Menlo,Consolas,monospace}
pre{background:#f2f2f4;padding:9px 11px;border-radius:6px;overflow-x:auto;font-size:13px;margin:8px 0}
code{background:#f2f2f4;padding:1px 4px;border-radius:3px;font-size:.92em}
a{color:var(--crimson)}
.wrap{max-width:960px;margin:0 auto;padding:0 18px 90px}

/* ---------- header ---------- */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hd{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.logo{width:20px;height:20px;background:var(--crimson);border-radius:3px;flex:none}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:5px 11px;border-radius:6px;background:#f2f2f4}
.timer.low{background:#fdecec;color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:7px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.12s}
.btn:hover{border-color:#c9c9cf;background:#fafafa}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff;font-weight:600}
.btn.pri:hover{background:#8d1450}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:41px;z-index:45;overflow-x:auto}
.tabs .in{max-width:960px;margin:0 auto;padding:0 18px;display:flex;gap:4px;width:100%}
.tab{border:0;background:none;padding:10px 13px;font:inherit;font-size:13.5px;cursor:pointer;
  color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--crimson);border-bottom-color:var(--crimson);font-weight:600}
.tab .cnt{font-size:11px;opacity:.75;margin-left:5px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
.bar{background:var(--crimson);color:#fff;padding:8px 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:14px}
.bar2{background:var(--crimson-l);color:#fff;padding:6px 14px;font-size:13px;font-weight:600}
.note{background:var(--crimson-bg);border-left:3px solid var(--crimson-l);padding:11px 14px;
  border-radius:0 7px 7px 0;font-size:13.2px;color:#3a3a3e;margin:12px 0}
.note p{margin:0 0 7px}.note p:last-child{margin:0}
h1{font-size:24px;color:var(--crimson);margin:22px 0 4px}
h2{font-size:17px;color:var(--crimson);margin:22px 0 8px}
h3{font-size:14.5px;margin:16px 0 6px}
table{border-collapse:collapse;width:100%;margin:9px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:#f7f0f4;font-weight:600}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  padding:2px 7px;border-radius:20px;background:#eee;color:#555;font-weight:600;vertical-align:2px}
.tag.low{background:#e6f4ea;color:#1E8A3C}
.tag.medium{background:#fdf0e0;color:#b35c00}
.tag.high{background:#fbe6ec;color:#a5194b}
.tag.off{background:#ece4f5;color:#5b3f8c}

/* ---------- questions ---------- */
.q{border-top:1px solid var(--line);padding:16px 0 4px}
.q:first-of-type{border-top:0}
.qh{display:flex;gap:9px;align-items:baseline;margin-bottom:6px}
.qn{font-weight:700;color:var(--crimson);min-width:26px}
.opts{display:flex;flex-direction:column;gap:5px;margin:9px 0 4px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;cursor:pointer;background:#fff;transition:.1s;font-size:14px}
.opt:hover{border-color:var(--crimson-l);background:#fdfafc}
.opt.sel{border-color:var(--crimson);background:var(--crimson-bg);box-shadow:inset 0 0 0 1px var(--crimson)}
.opt .k{font-weight:700;color:var(--muted);min-width:15px}
.opt.sel .k{color:var(--crimson)}
.opt.correct{border-color:var(--ok);background:#f1f9f3}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdf2f2}
.opt.wrong .k{color:var(--bad)}
.opt.dis{cursor:default}
.letters{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.lbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font:inherit;font-weight:600;cursor:pointer}
.lbtn.sel{border-color:var(--crimson);background:var(--crimson);color:#fff}
.lbtn.correct{border-color:var(--ok);background:#e6f4ea;color:var(--ok)}
.lbtn.wrong{border-color:var(--bad);background:#fdf2f2;color:var(--bad)}
.eqbox{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.75;
  background:#f8f8fa;border-radius:7px;padding:10px 14px;display:inline-block;margin:6px 0}
.vars{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;align-items:center}
.vin{display:flex;align-items:center;gap:5px;font-weight:600}
.vin input{width:56px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;text-align:center}
.vin input:focus{outline:2px solid var(--crimson-l);outline-offset:-1px}
.vin.ok input{border-color:var(--ok);background:#f1f9f3}
.vin.no input{border-color:var(--bad);background:#fdf2f2}

/* ---------- figure sequences ---------- */
.fsrow{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start;margin:8px 0}
.mcell{text-align:center}
.mcell .cap{font-size:10.5px;font-weight:700;color:#555;margin-bottom:3px}
.fsopt{border:1.5px solid transparent;border-radius:8px;padding:4px;cursor:pointer;background:#fff}
.fsopt:hover{border-color:var(--crimson-l)}
.fsopt.sel{border-color:var(--crimson);background:var(--crimson-bg)}
.fsopt.correct{border-color:var(--ok);background:#f1f9f3}
.fsopt.wrong{border-color:var(--bad);background:#fdf2f2}
.fscols{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.fscol h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fsstack{display:flex;gap:8px;flex-wrap:wrap}
.ltab{border-collapse:collapse}
.ltab td{width:26px;height:26px;text-align:center;padding:0;border:1px solid #666;font-weight:600;font-size:14px}
.ltab td.hdr,.ltab td.rowh{border:0;color:var(--muted);font-size:11px;font-weight:700;width:16px;height:16px}
.ltab td.tgt{background:#eee}
.ltab td.tgt.rev{background:#e6f4ea;color:var(--ok)}

/* ---------- results ---------- */
.score{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.big{font-size:44px;font-weight:800;color:var(--crimson);line-height:1}
.bars{margin:14px 0}
.brow{display:flex;align-items:center;gap:11px;margin:7px 0;font-size:13.5px}
.brow .lbl{width:190px;flex:none}
.btrack{flex:1;height:9px;background:#ececed;border-radius:6px;overflow:hidden}
.bfill{height:100%;background:var(--crimson);border-radius:6px}
.brow .val{width:76px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.expl{background:#f7f7f9;border-left:3px solid var(--crimson-l);padding:9px 13px;
  border-radius:0 7px 7px 0;font-size:13.2px;margin:9px 0 2px;color:#333}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:15px;background:#fff;cursor:pointer;transition:.12s}
.pcard:hover{border-color:var(--crimson-l);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pcard h3{margin:0 0 4px;color:var(--crimson)}
.pcard .st{font-size:12.5px;color:var(--muted)}
.footbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:60}
.fb{max-width:960px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px}
.prog{flex:1;height:7px;background:#ececed;border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--crimson);width:0}
.hide{display:none !important}
@media(max-width:640px){
  .brow .lbl{width:120px} .wrap{padding:0 12px 96px} .card{padding:14px}
  .hd{padding:9px 12px}
}

/* ---------- persistence / resume ---------- */
.tag.warn{background:#fdf0e0;color:#b35c00}
.note.resume{background:#fff8ec;border-left-color:var(--warn)}
.note.warnbox{background:#fdecec;border-left-color:var(--bad)}
.resrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:7px 0 0}
.resrow .spacer{flex:1;min-width:0}

/* ---------- flags ---------- */
.qh .spacer{flex:1;min-width:0}
.flagbtn{border:1px solid var(--line);background:#fff;color:#b0b0b6;border-radius:7px;
  width:30px;height:28px;line-height:1;font-size:15px;cursor:pointer;flex:none;padding:0;transition:.12s}
.flagbtn:hover{border-color:var(--warn);color:var(--warn)}
.flagbtn.on{border-color:var(--warn);background:#fff6ea;color:var(--warn)}

/* ---------- current-question cursor ---------- */
.card.cur{border-color:var(--crimson-l);box-shadow:0 0 0 2px rgba(165,25,91,.13)}
.q.cur{background:var(--crimson-bg);border-radius:8px;
  box-shadow:0 0 0 6px var(--crimson-bg);}
.fscol.active h4{color:var(--crimson)}
.fscol.active .fsstack{box-shadow:0 0 0 2px rgba(165,25,91,.16);border-radius:9px}

/* ---------- question navigator ---------- */
.navpanel{position:fixed;left:0;right:0;bottom:47px;background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.07);z-index:58}
.navpanel .np{max-width:960px;margin:0 auto;padding:11px 18px 13px}
.nphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px;font-size:13px}
.nphead .spacer{flex:1;min-width:0}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend .lg{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);display:inline-block;margin-left:5px}
.legend .lg.done{background:var(--crimson);border-color:var(--crimson)}
.legend .lg.todo{background:#fff}
.legend .lg.flag{background:#fff6ea;border-color:var(--warn)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;
  max-height:34vh;overflow-y:auto}
.chip{height:31px;border:1px solid var(--line);border-radius:7px;background:#fff;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:0;
  font-variant-numeric:tabular-nums;position:relative;transition:.1s}
.chip:hover{border-color:var(--crimson-l)}
.chip.done{background:var(--crimson);border-color:var(--crimson);color:#fff}
.chip.part{background:var(--crimson-bg);border-color:var(--crimson-l);color:var(--crimson)}
.chip.flag{border-color:var(--warn);border-width:2px}
.chip.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;
  border-radius:50%;background:var(--warn)}
.chip.cur{outline:2px solid var(--ink);outline-offset:1px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,20,24,.42);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:18px}
.modal .mbox{background:#fff;border-radius:12px;max-width:560px;width:100%;
  max-height:82vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.24)}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff}
.mhead .spacer{flex:1}
.mbody{padding:15px 17px 19px}
.mbody td{vertical-align:middle}
kbd{display:inline-block;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;
  background:#f2f2f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px}

/* ---------- exam mode ---------- */
.timer.exam{background:#f7f0f4;color:var(--crimson)}
.timer.low{background:#fdecec;color:var(--bad)}
.tab.locked{opacity:.62}
.lockmark{font-size:11px;margin-left:3px}
.opt.dis,.fsopt.dis{cursor:default}
.opt.dis:hover{border-color:var(--line);background:#fff}
.fsopt.dis:hover{border-color:transparent}
.lbtn:disabled{opacity:.5;cursor:not-allowed}
.vin input:disabled{background:#f4f4f6;color:var(--muted)}

/* ---------- mode chooser ---------- */
.modepick{display:grid;gap:11px;grid-template-columns:1fr}
.modecard{display:block;text-align:left;border:1px solid var(--line);border-radius:10px;
  background:#fff;padding:14px 16px;font:inherit;cursor:pointer;transition:.12s}
.modecard:hover{border-color:var(--crimson);background:#fdfafc;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.modecard strong{display:block;color:var(--crimson);font-size:15px;margin-bottom:4px}
.modecard span{display:block;color:var(--muted);font-size:13px;line-height:1.5}
@media(min-width:620px){.modepick{grid-template-columns:1fr 1fr}}

/* ---------- review filters ---------- */
.filterbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:13px}

/* ---------- charts ---------- */
.chartbox{margin:10px 0 4px}
.chart{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:9px}
.chartlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.chartlegend span{display:flex;align-items:center;gap:6px}
.chartlegend i{width:13px;height:3px;border-radius:2px;display:inline-block}
.copybox{width:100%;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;
  border:1px solid var(--line);border-radius:7px;padding:9px;resize:vertical}

/* ---------- accessibility ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2.5px solid var(--crimson);outline-offset:2px;border-radius:4px}
.opt:focus-visible,.fsopt:focus-visible,.lbtn:focus-visible,.chip:focus-visible{
  outline:2.5px solid var(--crimson);outline-offset:2px}
.cbtoggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;
  user-select:none;white-space:nowrap}
.cbtoggle input{width:16px;height:16px;accent-color:var(--crimson);cursor:pointer;margin:0}

/* ---------- responsive figure sequences ----------
   The SVGs keep their 5x5 viewBox and are scaled by CSS, so the grid lines and
   figures shrink together and stay legible. 52px is 10.4px per cell, which is
   about the floor for reading an orientation. */
.mx{width:75px;height:75px;display:block}
.fsrow{gap:9px}
@media(max-width:820px){ .mx{width:66px;height:66px} .fscols{gap:18px} }
@media(max-width:600px){
  .mx{width:60px;height:60px}
  .fscols{flex-direction:column;gap:14px}
  .fsstack{gap:6px}
  .fsrow{gap:6px}
}
@media(max-width:400px){ .mx{width:52px;height:52px} }
.fsrow,.fscols{max-width:100%}
.ltab{max-width:100%}
@media(max-width:400px){ .ltab td{width:22px;height:22px;font-size:12.5px} }

/* ---------- print ----------
   Print the paper, not the app: the chrome, the clock, the navigator and
   anything you can click on disappear, and no question is split across a
   page boundary. */
/* About / contact block on the home screen. */
.about{border-left:3px solid var(--crimson)}
.about a{color:var(--crimson);font-weight:600}
.contact{margin:11px 0 13px;font-size:13.5px}
.contact a{word-break:break-all}

/* Sign-up form inside the About block. */
.signup{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.signupH{margin:0 0 2px;font-size:15px;color:var(--crimson)}
.signup .fld{display:block;font-size:13px;font-weight:600;margin:11px 0 4px}
.signup input[type=text],.signup input[type=email],.signup textarea{
  width:100%;max-width:420px;font:inherit;font-size:13.5px;padding:7px 9px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);color:inherit}
.signup textarea{resize:vertical;min-height:46px}
.signup .err{display:block;color:var(--bad);font-size:12.2px;margin-top:3px}
.signup .consent{display:flex;gap:8px;align-items:flex-start;margin-top:13px;
  font-size:12.8px;max-width:460px;font-weight:400}
.signup .consent input{margin-top:2px;flex:none}
.suRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sustatus{font-size:12.8px;color:var(--muted)}
.sustatus.good{color:var(--ok);font-weight:600}
.sustatus.bad{color:var(--bad);font-weight:600}
/* Honeypot is positioned off-screen rather than display:none — some bots skip
   fields they can tell are not rendered. Hidden from assistive tech by the
   aria-hidden on the wrapper and tabindex=-1 on the input. */
.hpot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

@media print{
  @page{margin:14mm 12mm}
  header,.tabs,.footbar,.navpanel,.modal,.flagbtn,.filterbar,#timer,
  .btn,button,.legend,.cbtoggle{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .card{border:1px solid #999;border-radius:0;padding:10px 12px;margin:0 0 10px;
    break-inside:avoid;page-break-inside:avoid}
  .q{break-inside:avoid;page-break-inside:avoid;border-top:1px solid #bbb}
  .q.cur{background:none;box-shadow:none}
  .card.cur{box-shadow:none;border-color:#999}
  .bar{background:#fff;color:#000;border:1px solid #000;border-radius:0;
    break-after:avoid;page-break-after:avoid}
  .bar2{background:#fff;color:#000;border:1px solid #000;border-top:0;
    break-after:avoid;page-break-after:avoid}
  h1,h2,h3{color:#000;break-after:avoid;page-break-after:avoid}
  .about{display:none !important}
  .signup{display:none !important}
  .note,.expl{background:#fff;border-left:2px solid #000;border-radius:0;
    break-inside:avoid;page-break-inside:avoid}
  .opt,.fsopt,.lbtn{border-color:#666;background:#fff !important;box-shadow:none !important}
  .opt.sel,.fsopt.sel{box-shadow:none;outline:1.5px solid #000;background:#fff !important}
  .opt.sel .k::after{content:" \2713"}
  .tag{border:1px solid #666;background:#fff;color:#000}
  .eqbox{background:#fff;border:1px solid #999}
  .fscols{break-inside:avoid;page-break-inside:avoid}
  .mx{width:62px;height:62px}
  table,.ltab{break-inside:avoid;page-break-inside:avoid}
  th{background:#fff;border-color:#666}
  td{border-color:#666}
  a{color:#000;text-decoration:none}
  .chart{border-color:#666}
}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo"></div>
  <div class="brand">GMAT<small>Practice Suite</small></div>
  <div class="spacer"></div>
  <div id="timer" class="timer hide">00:00</div>
  <button class="btn sm" id="helpBtn" onclick="toggleHelp()" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
  <button class="btn sm" id="homeBtn" onclick="goHome()">All papers</button>
</div></header>

<div class="tabs hide" id="tabs"><div class="in" id="tabsIn"></div></div>

<div class="wrap" id="app"></div>

<div class="navpanel hide" id="navpanel">
  <div class="np">
    <div class="nphead">
      <strong id="npTitle">Questions</strong>
      <span class="legend"><i class="lg done"></i>answered <i class="lg todo"></i>unanswered
        <i class="lg flag"></i>flagged</span>
      <span class="spacer"></span>
      <span id="npCb"></span>
      <button class="btn sm" onclick="toggleNav()" aria-label="Close navigator">Close</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="footbar hide" id="foot"><div class="fb">
  <span id="fstat" class="muted" style="font-size:13px"></span>
  <div class="prog"><i id="fprog"></i></div>
  <button class="btn" onclick="prevTab()">&#8592; Prev</button>
  <button class="btn" onclick="nextTab()">Next &#8594;</button>
  <button class="btn" id="navBtn" onclick="toggleNav()" aria-expanded="false">Navigator</button>

"],["C","A","E","D","B"],["A","B","C","E","D"],["B","C","D","A","E"]]},{"n":13,"lvl":"medium","note":"","grid":[["B","C","","",""],["","D","B","",""],["","","","E",""],["","E","","B","C"],["","A","E","",""]],"t":[2,4],"ans":"D","full":[["B","C","D","A","E"],["E","D","B","C","A"],["A","B","C","E","D"],["D","E","A","B","C"],["C","A","E","D","B"]]},{"n":14,"lvl":"medium","note":"","grid":[["C","","","",""],["","","","","A"],["E","","","A","B"],["D","A","E","",""],["A","","","D",""]],"t":[4,2],"ans":"B","full":[["C","B","A","E","D"],["B","E","D","C","A"],["E","D","C","A","B"],["D","A","E","B","C"],["A","C","B","D","E"]]},{"n":15,"lvl":"high","note":"Official Exercise 5","grid":[["","","","C",""],["","C","","E",""],["","E","","B","C"],["A","B","","D","E"],["","D","E","A",""]],"t":[1,2],"ans":"D","full":[["E","A","B","C","D"],["B","C","D","E","A"],["D","E","A","B","C"],["A","B","C","D","E"],["C","D","E","A","B"]]},{"n":16,"lvl":"high","note":"","grid":[["A","C","","",""],["","D","","",""],["","","","","E"],["E","","","A","C"],["","","B","",""]],"t":[0,3],"ans":"B","full":[["A","C","E","B","D"],["C","D","A","E","B"],["B","A","C","D","E"],["E","B","D","A","C"],["D","E","B","C","A"]]},{"n":17,"lvl":"high","note":"","grid":[["E","","B","",""],["D","","","",""],["","B","D","",""],["","E","","",""],["","A","","","E"]],"t":[1,3],"ans":"A","full":[["E","D","B","C","A"],["D","C","E","A","B"],["A","B","D","E","C"],["C","E","A","B","D"],["B","A","C","D","E"]]},{"n":18,"lvl":"high","note":"","grid":[["","B","D","C",""],["","D","C","",""],["","A","B","D",""],["","","","",""],["","","","","B"]],"t":[3,2],"ans":"A","full":[["A","B","D","C","E"],["B","D","C","E","A"],["E","A","B","D","C"],["C","E","A","B","D"],["D","C","E","A","B"]]},{"n":19,"lvl":"high","note":"","grid":[["","","","A",""],["","B","","","D"],["B","","E","",""],["","D","","",""],["","","","B","C"]],"t":[3,0],"ans":"A","full":[["D","E","C","A","B"],["C","B","A","E","D"],["B","C","E","D","A"],["A","D","B","C","E"],["E","A","D","B","C"]]},{"n":20,"lvl":"high","note":"","grid":[["","B","E","",""],["","","","","A"],["D","","B","",""],["","","","D","B"],["","C","","",""]],"t":[1,0],"ans":"E","full":[["A","B","E","C","D"],["E","D","C","B","A"],["D","A","B","E","C"],["C","E","A","D","B"],["B","C","D","A","E"]]}],"subject":[{"title":"Testlet 1 — Data Types and Type Conversion","area":"Applied Computer Science · Questions 1–8","stimulus":"<p>A <em>variable</em> is a name for a memory location that holds a value. In statically typed languages every variable is declared with a type, and the type fixes both the set of representable values and the amount of memory reserved. A representative selection from Java:</p><table><thead><tr><th>Type</th><th>Values</th><th>Memory</th></tr></thead><tbody><tr><td><code>boolean</code></td><td><code>false</code>, <code>true</code></td><td>1 bit</td></tr><tr><td><code>short</code></td><td>integers from −2¹⁵ to 2¹⁵−1</td><td>16 bit</td></tr><tr><td><code>int</code></td><td>integers from −2³¹ to 2³¹−1</td><td>32 bit</td></tr><tr><td><code>float</code></td><td>floating-point, magnitude up to ≈ ±10³⁸</td><td>32 bit</td></tr><tr><td><code>double</code></td><td>floating-point, magnitude up to ≈ ±10³⁰⁸</td><td>64 bit</td></tr><tr><td><code>string</code></td><td>character sequence of any length</td><td>depends on length</td></tr></tbody></table><p>A declaration reserves memory and may initialise it, e.g. <code>int x = 5;</code> or <code>string s = \"Hello\";</code>. Floating-point literals are written with a decimal point and/or an exponent, so <code>5.0</code>, <code>+5e0</code>, <code>+50e-1</code>, <code>5.00000e0</code> and <code>5f</code> all denote the same value; the suffix <code>f</code> forces type <code>float</code> and <code>d</code> forces <code>double</code>.</p><p>Two conversion rules matter for this testlet:</p><ol><li><strong>Arithmetic is carried out only in <code>int</code> or in <code>double</code>.</strong> Before any operation, narrower integer types (<code>short</code>) are promoted to <code>int</code> and <code>float</code> is promoted to <code>double</code>. If the two operands differ, both are unified to the wider type, so mixing an <code>int</code> with a <code>double</code> makes the whole operation a <code>double</code> operation.</li><li><strong>Integer arithmetic stays integral.</strong> A division of two <code>int</code> values discards the fractional part rather than rounding it. An implicit conversion also happens on assignment, so <code>float f6 = 5;</code> and <code>float f7 = 2 * 2.5;</code> are both legal.</li></ol>","questions":[{"n":1,"stem":"<p>You need a variable <code>married</code> recording whether a person is married, a variable <code>age</code> holding a person's age, and a variable <code>name</code> holding the person's name. Which set of types is most appropriate?</p>","options":["`boolean married; float age; string name;`","`int married; float age; string name;`","`boolean married; short age; string name;`","`short married; short age; double name;`"],"ans":2,"expl":"<code>married</code> only needs <code>true</code>/<code>false</code>, so <code>boolean</code>. A name is a character sequence, so <code>string</code>. An age is a whole number well inside ±32 767, so <code>short</code> is the smallest adequate type. Using <code>float</code> for an age wastes memory and introduces rounding."},{"n":2,"stem":"<p>Two values held in two <code>float</code> variables are added. In which type is the calculation performed?</p>","options":["`boolean`","`float`","`int`","`double`"],"ans":3,"expl":"Java calculates only in <code>int</code> or <code>double</code>. Two <code>float</code> operands are promoted to <code>double</code>."},{"n":3,"stem":"<p>Two values held in two <code>short</code> variables are divided. In which type is the calculation performed?</p>","options":["`float`","`int`","`double`","`short`"],"ans":1,"expl":"Two <code>short</code> operands are promoted to <code>int</code>, so the division is integer division."},{"n":4,"stem":"<p>Given the program</p><pre>short s = 4;\nfloat  x = 3 + s/3;</pre><p>What is the value of <code>x</code> after the assignment?</p>","options":["4.3333333","4","3","4.25"],"ans":1,"expl":"<code>s</code> is promoted to <code>int</code>, so <code>s/3 = 4/3 = 1</code> (fractional part discarded). <code>3 + 1 = 4</code>, then implicitly converted to <code>float</code>. <strong>Note:</strong> the official prep material prints <code>short s = 4</code> in the code but writes “s = 3” in its own solution text; the code is authoritative and the answer 4 is unaffected."},{"n":5,"stem":"<p>You need 1000 <code>float</code> variables. How much memory do they require?</p>","options":["16 000 bit = 2 000 byte","1 000 bit = 125 byte","32 000 bit = 4 000 byte","32 768 bit = 4 096 byte"],"ans":2,"expl":"1000 × 32 bit = 32 000 bit; 32 000 ÷ 8 = 4 000 byte."},{"n":6,"stem":"<p>Given the program</p><pre>int    i = 2;\ndouble d = (-i)*(1/i)+1f;</pre><p>What is the value of <code>d</code> after the assignment?</p>","options":["−1","0","2","1"],"ans":3,"expl":"<code>1/i</code> is <code>int</code> division: <code>1/2 = 0</code>. Then <code>(-2) × 0 = 0</code>, and <code>0 + 1f = 1</code>."},{"n":7,"stem":"<p>A program stores 2 000 <code>short</code> values and 1 000 <code>double</code> values. How much memory do these values require in total?</p>","options":["48 000 bit = 6 000 byte","96 000 bit = 12 000 byte","80 000 bit = 10 000 byte","24 000 bit = 3 000 byte"],"ans":1,"expl":"2 000 × 16 bit = 32 000 bit; 1 000 × 64 bit = 64 000 bit; total 96 000 bit, which is 12 000 byte."},{"n":8,"stem":"<p>Given the program</p><pre>short s = 10;\nint   i = 3;\nfloat f = 5f;\ndouble r = s/i + f/2;</pre><p>What is the value of <code>r</code> after the assignment?</p>","options":["5.5","6.0","5.0","5.8333333"],"ans":0,"expl":"<code>s/i</code>: <code>short</code> is promoted to <code>int</code>, so <code>10/3 = 3</code>. <code>f/2</code>: <code>float</code> is promoted to <code>double</code>, so <code>5.0/2 = 2.5</code>. Sum = <strong>5.5</strong>."}]},{"title":"Testlet 2 — Linear Transformations of High-Dimensional Data Sets","area":"Mathematics · Questions 9–16","stimulus":"<p>Linear transformations are used throughout data science to reduce the dimensionality of data sets, which are normally stored as matrices. By convention, <strong>rows are observations and columns are features</strong>. Three notions from matrix algebra underpin the methods below.</p><p>The <strong>rank</strong> of a matrix is the number of linearly independent rows (equivalently, columns). A row is linearly independent if it cannot be written as a linear combination of the other rows. In practice the rank is read off the row-echelon form as the number of non-zero rows.</p><p>The <strong>dimension</strong> of a matrix is the pair <em>(number of rows, number of columns)</em>, written <em>m × n</em>.</p><p>An <strong>eigenvalue</strong> λ is a scalar describing how a transformation stretches or shrinks a vector along a particular direction. Eigenvalues solve the characteristic equation</p><blockquote><p>det(A − λI) = 0,</p></blockquote><p>where <em>I</em> is the identity matrix of the same size as <em>A</em>. For a 2 × 2 matrix A = [[a, b], [c, d]] the determinant is det(A) = ad − bc. The characteristic equation is a polynomial of degree <em>n</em>; its roots are the eigenvalues. Each eigenvector <em>x</em> then solves (A − λI)·x = 0.</p><p><strong>Principal Component Analysis (PCA)</strong> is an unsupervised linear transformation that projects the data onto the directions of greatest variance; the resulting space is the principal subspace. <strong>Linear Discriminant Analysis (LDA)</strong> is the supervised counterpart: it seeks the linear combinations of features that best separate known classes, and with <em>c</em> classes it yields at most <em>c − 1</em> discriminants. The <strong>reconstruction error</strong> — the sum of squared distances between original points and their reconstructions — measures how much information the reduction destroyed.</p><p><em>Questions 9–12 refer to the matrix</em></p><pre>M = | 2  1 |\n    | 1  2 |</pre>","questions":[{"n":9,"stem":"<p>What is the rank of M?</p>","options":["1","2","4","3"],"ans":1,"expl":"det(M) = 2·2 − 1·1 = 3 ≠ 0, so M has full rank; for a 2 × 2 matrix that is rank 2."},{"n":10,"stem":"<p>What are the eigenvalues of M?</p>","options":["2, 2","1, 3","1, 1","3, 3"],"ans":1,"expl":"det(M − λI) = (2 − λ)² − 1 = 0 → λ² − 4λ + 3 = 0 → λ = 1 and λ = 3."},{"n":11,"stem":"<p>M is transformed using PCA and only the first principal component is kept. What is the dimensionality of the resulting matrix?</p>","options":["2 × 2","1 × 1","1 × 2","2 × 1"],"ans":3,"expl":"Rows are observations, columns are features. Keeping one principal component reduces the feature space to 1 while the 2 observations remain, giving <strong>2 × 1</strong>."},{"n":12,"stem":"<p>M is transformed using LDA with two classes and only the first linear discriminant is kept. What is the dimensionality of the resulting matrix?</p>","options":["2 × 1","1 × 1","1 × 2","2 × 2"],"ans":0,"expl":"Same reasoning. With <em>c</em> = 2 classes LDA yields at most <em>c</em> − 1 = 1 discriminant, so the result is again <strong>2 × 1</strong>."},{"n":13,"stem":"<p><em>Questions 13–16 refer to the vectors u = [1, 2, 3] and v = [4, 5, 6].</em></p><p>What is the dot product of u and v?</p>","options":["12","6","32","56"],"ans":2,"expl":"1·4 + 2·5 + 3·6 = 4 + 10 + 18 = <strong>32</strong>."},{"n":14,"stem":"<p>Which statement about a matrix A ∈ ℝⁿˣⁿ with n-dimensional column vectors a₁, …, aₙ is true if A is invertible?</p>","options":["A must have full rank, which is equivalent to a₁, …, aₙ being linearly independent, and det(A) must be non-zero.","a₁, …, aₙ are linearly dependent and A must not have full rank.","det(A) must be exactly zero while a₁, …, aₙ are linearly independent.","A has full rank, but the determinant may take any value including zero."],"ans":0,"expl":"Invertibility, full rank, linear independence of the columns and a non-zero determinant are all equivalent for a square matrix. Option d fails because a zero determinant contradicts full rank."},{"n":15,"stem":"<p>Which of the following is <strong>not</strong> a commonly used <em>linear</em> method for dimensionality reduction?</p>","options":["Random Forest","Principal Component Analysis","Linear Discriminant Analysis","Factor Analysis"],"ans":0,"expl":"Random Forest is an ensemble of decision trees used for classification and regression; it ranks feature importance but performs no linear transformation of the feature space. PCA, LDA and Factor Analysis all do."},{"n":16,"stem":"<p>Which statement describes a genuine limitation of linear methods for dimensionality reduction?</p>","options":["They cannot be applied to data sets with more than 1 000 observations.","They always increase the reconstruction error to 100 %.","They require the number of features to equal the number of observations.","They can only capture linear relationships between the variables."],"ans":3,"expl":"Linear methods assume linear relationships between variables, which real-world data frequently violates. This is why non-linear methods (kernel PCA, t-SNE, UMAP, autoencoders) exist. &gt; <strong>Correction note.</strong> In the official preparatory materials the solutions to Exercise 3 &gt; are misnumbered from Question 4 onwards (the solution labelled “Q4” answers the dot &gt; product, and the printed options for “Q7” belong to a different stem). The versions above &gt; restore the intended question–answer pairing."}]},{"title":"Testlet 3 — Describing Data and Reasoning under Uncertainty","area":"Mathematics · Questions 17–24","stimulus":"<p>Descriptive statistics summarise a sample. The <strong>arithmetic mean</strong> is the sum of the values divided by their count; the <strong>median</strong> is the middle value of the ordered sample; the <strong>mode</strong> is the most frequent value. The mean uses every value and is therefore pulled towards extreme observations, while the median depends only on the position of the values and is far more robust. In a <strong>right-skewed</strong> (positively skewed) distribution a long tail of large values drags the mean above the median; in a left-skewed distribution the reverse holds.</p><p>Spread is described by the <strong>variance</strong>. For a full population of <em>n</em> values, σ² = Σ(xᵢ − μ)² / n, and the <strong>standard deviation</strong> σ is its square root. For an approximately normal distribution roughly 68 % of the mass lies within one standard deviation of the mean, roughly 95 % within two, and roughly 99.7 % within three.</p><p>For probabilities, two events A and B are <strong>independent</strong> when P(A ∩ B) = P(A) · P(B), and in general P(A ∪ B) = P(A) + P(B) − P(A ∩ B). <strong>Bayes' theorem</strong> updates a prior belief with evidence:</p><blockquote><p>P(H | E) = P(E | H) · P(H) / P(E),  where P(E) = P(E | H)·P(H) + P(E | ¬H)·P(¬H).</p></blockquote><p>For a diagnostic test, <em>sensitivity</em> is P(positive | disease) and <em>specificity</em> is P(negative | no disease), so the false-positive rate is 1 − specificity.</p>","questions":[{"n":17,"stem":"<p>What is the median of the sample 4, 8, 8, 10, 15?</p>","options":["8","9","10","8.5"],"ans":0,"expl":"The ordered sample is 4, 8, 8, 10, 15; with five values the third one, 8, is the median. (The mean is 9 — a classic distractor.)"},{"n":18,"stem":"<p>What is the population standard deviation of the sample 2, 4, 4, 4, 5, 5, 7, 9?</p>","options":["4","2","2.5","1.5"],"ans":1,"expl":"Mean = 40/8 = 5. Squared deviations: 9, 1, 1, 1, 0, 0, 4, 16 → sum 32. Population variance = 32/8 = 4, so σ = <strong>2</strong>."},{"n":19,"stem":"<p>A disease affects 1 % of a population. A test has a sensitivity of 99 % and a specificity of 95 %. A randomly chosen person tests positive. What is the probability that this person actually has the disease?</p>","options":["about 99 %","about 50 %","about 17 %","about 1 %"],"ans":2,"expl":"P(pos) = 0.99·0.01 + 0.05·0.99 = 0.0099 + 0.0495 = 0.0594. P(disease | pos) = 0.0099 / 0.0594 = 1/6 ≈ <strong>16.7 %</strong>. With a rare condition, most positives are false positives — this is the base-rate fallacy."},{"n":20,"stem":"<p>Two fair six-sided dice are thrown. What is the probability that the sum of the two results is exactly 8?</p>","options":["5/36","1/6","1/9","6/36"],"ans":0,"expl":"The favourable pairs are (2,6), (3,5), (4,4), (5,3), (6,2): five out of 36 equally likely outcomes, so <strong>5/36</strong>. Option d, 6/36, is the answer for a sum of 7."},{"n":21,"stem":"<p>A distribution of household incomes is strongly right-skewed. What is the expected relationship between its mean and its median?</p>","options":["mean < median","mean = median","mean > median","the mode equals the mean"],"ans":2,"expl":"A long right tail pulls the mean above the median."},{"n":22,"stem":"<p>Which measure of central tendency is least affected by a single extreme outlier?</p>","options":["the arithmetic mean","the median","the variance","the range"],"ans":1,"expl":"The median depends only on rank order, so a single extreme value moves it by at most one position. Variance and range are the <em>most</em> outlier-sensitive of the four."},{"n":23,"stem":"<p>For two independent events, P(A) = 0.4 and P(B) = 0.5. What is P(A ∪ B)?</p>","options":["0.9","0.7","0.2","0.6"],"ans":1,"expl":"Independence gives P(A ∩ B) = 0.4 · 0.5 = 0.2, so P(A ∪ B) = 0.4 + 0.5 − 0.2 = <strong>0.7</strong>."},{"n":24,"stem":"<p>In an approximately normal distribution, roughly what proportion of the values lies within two standard deviations of the mean?</p>","options":["68 %","95 %","99.7 %","50 %"],"ans":1,"expl":"The empirical rule: ≈ 68 % within 1σ, ≈ 95 % within 2σ, ≈ 99.7 % within 3σ."}]},{"title":"Testlet 4 — Algorithms, Complexity and Data Structures","area":"Theoretical Computer Science · Questions 25–32","stimulus":"<p>The <strong>running time</strong> of an algorithm is described asymptotically with the O-notation, which states how the number of elementary operations grows with the input size <em>n</em> and ignores constant factors. Common growth classes, in increasing order, are O(1) ⊂ O(log n) ⊂ O(n) ⊂ O(n log n) ⊂ O(n²) ⊂ O(2ⁿ).</p><p><em>Binary search</em> halves a sorted array at each step, so it performs at most ⌈log₂ n⌉ comparisons. <em>Merge sort</em> runs in O(n log n) in every case but needs an auxiliary array of size <em>n</em>. <em>Quicksort</em> also averages O(n log n), yet a pathological choice of pivots — for example, always the smallest remaining element — degrades it to quadratic behaviour. A <em>hash table</em> stores keys in buckets computed from a hash function, giving expected constant lookup time when collisions are rare, though the worst case is linear.</p><p>Data structures differ in their access discipline: a <strong>stack</strong> is last-in-first-out, a <strong>queue</strong> is first-in-first-out, and a <strong>graph</strong> with <em>V</em> vertices and <em>E</em> edges is usually stored as an adjacency list so that a traversal visits every vertex and every edge once.</p>","questions":[{"n":25,"stem":"<p>What is the worst-case time complexity of binary search on a sorted array of <em>n</em> elements?</p>","options":["O(n)","O(log n)","O(n log n)","O(1)"],"ans":1,"expl":"Each comparison halves the remaining interval, so the number of steps is logarithmic in <em>n</em>."},{"n":26,"stem":"<p>What is the worst-case time complexity of quicksort?</p>","options":["O(n log n)","O(n)","O(n²)","O(log n)"],"ans":2,"expl":"With a consistently poor pivot each partition removes only one element, giving n + (n−1) + … = O(n²)."},{"n":27,"stem":"<p>What is the <strong>expected</strong> time complexity of a lookup in a well-dimensioned hash table?</p>","options":["O(1)","O(log n)","O(n)","O(n log n)"],"ans":0,"expl":"With a good hash function and a controlled load factor the expected number of probes is constant. (The worst case is O(n).)"},{"n":28,"stem":"<p>A sorted array contains 1 000 000 elements. What is the maximum number of comparisons a binary search needs? <em>(Use log₂ 10⁶ ≈ 19.93.)</em></p>","options":["10","20","1 000","500 000"],"ans":1,"expl":"⌈log₂ 10⁶⌉ = ⌈19.93⌉ = <strong>20</strong> comparisons."},{"n":29,"stem":"<p>Which data structure implements a first-in-first-out access discipline?</p>","options":["stack","queue","binary heap","hash table"],"ans":1,"expl":"A queue: the first element inserted is the first removed. A stack is LIFO."},{"n":30,"stem":"<p>What is the auxiliary space complexity of the standard array implementation of merge sort?</p>","options":["O(1)","O(log n)","O(n)","O(n²)"],"ans":2,"expl":"The standard merge step writes into an auxiliary array of the same length as the input, so O(n) extra space. (This is exactly why in-place sorts are preferred when memory is tight.)"},{"n":31,"stem":"<p>Consider the loop</p><pre>for i = 1 to n:\n    for j = 1 to i:\n        do one operation</pre><p>How many operations are executed in total, and in which complexity class does this lie?</p>","options":["n operations, O(n)","n·(n+1)/2 operations, O(n²)","n² operations, O(n log n)","2ⁿ operations, O(2ⁿ)"],"ans":1,"expl":"The inner loop runs 1 + 2 + … + n = n(n+1)/2 times, which is ½n² + ½n and so lies in <strong>O(n²)</strong>."},{"n":32,"stem":"<p>A graph with <em>V</em> vertices and <em>E</em> edges is stored as an adjacency list. What is the time complexity of a complete breadth-first search?</p>","options":["O(V)","O(V²)","O(V + E)","O(V · E)"],"ans":2,"expl":"BFS visits each vertex once and inspects each edge once (twice in an undirected adjacency list), giving <strong>O(V + E)</strong>."}]},{"title":"Testlet 5 — Model Fitting and Evaluation","area":"Applied Computer Science · Questions 33–40","stimulus":"<p>In <strong>supervised</strong> learning a model is fitted to labelled examples, whereas <strong>unsupervised</strong> methods such as k-means clustering look for structure in unlabelled data. The available data is split: the <em>training set</em> fits the parameters, a <em>validation set</em> selects hyper-parameters and compares candidate models, and a held-out <em>test set</em> is used once to estimate generalisation performance.</p><p>A model that is too simple to capture the signal <strong>underfits</strong> — it performs poorly on both training and test data. A model that memorises the training data, including its noise, <strong>overfits</strong>: training performance is excellent while test performance collapses.</p><p>For a binary classifier the results are summarised in a confusion matrix. With <em>TP</em> true positives, <em>FP</em> false positives, <em>FN</em> false negatives and <em>TN</em> true negatives:</p><blockquote><p>accuracy = (TP + TN) / (TP + FP + FN + TN) precision = TP / (TP + FP) recall = TP / (TP + FN) F1 = 2 · precision · recall / (precision + recall)</p></blockquote><p><em>Questions 33–36 refer to the following result on a test set of 200 cases.</em></p><table><thead><tr><th></th><th>predicted positive</th><th>predicted negative</th></tr></thead><tbody><tr><td><strong>actually positive</strong></td><td>TP = 40</td><td>FN = 20</td></tr><tr><td><strong>actually negative</strong></td><td>FP = 10</td><td>TN = 130</td></tr></tbody></table>","questions":[{"n":33,"stem":"<p>What is the accuracy of the classifier?</p>","options":["0.80","0.85","0.67","0.20"],"ans":1,"expl":"(TP + TN)/total = (40 + 130)/200 = 170/200 = <strong>0.85</strong>."},{"n":34,"stem":"<p>What is the precision of the classifier?</p>","options":["0.80","0.67","0.85","0.50"],"ans":0,"expl":"TP/(TP + FP) = 40/50 = <strong>0.80</strong>."},{"n":35,"stem":"<p>What is the recall of the classifier?</p>","options":["0.80","0.85","0.67","0.40"],"ans":2,"expl":"TP/(TP + FN) = 40/60 ≈ <strong>0.67</strong>."},{"n":36,"stem":"<p>What is the F1 score of the classifier? <em>(Round to two decimals.)</em></p>","options":["0.73","0.80","0.67","0.85"],"ans":0,"expl":"F1 = 2 · 0.80 · 0.667 / (0.80 + 0.667) = 1.0667 / 1.4667 ≈ <strong>0.73</strong>. The harmonic mean sits below the arithmetic mean of 0.735, and well below accuracy — with 130 easy true negatives, accuracy flatters this model."},{"n":37,"stem":"<p>A model achieves 99 % accuracy on the training set but only 62 % on the test set. What is the most plausible diagnosis?</p>","options":["underfitting","overfitting","class imbalance in the test set","data leakage from the test set"],"ans":1,"expl":"A large gap between training and test performance is the signature of overfitting: the model has learned noise specific to the training set."},{"n":38,"stem":"<p>Which of the following is an <strong>unsupervised</strong> learning method?</p>","options":["logistic regression","k-means clustering","random forest classification","linear discriminant analysis"],"ans":1,"expl":"k-means needs no labels. Logistic regression, random forest classification and LDA are all supervised."},{"n":39,"stem":"<p>What is the primary purpose of a validation set?</p>","options":["to increase the number of training examples","to select hyper-parameters and compare models without touching the test set","to replace the test set in the final report","to guarantee that the classes are balanced"],"ans":1,"expl":"The test set must be touched once, at the very end. Hyper-parameter tuning and model comparison belong to the validation set, otherwise the test estimate is optimistically biased."},{"n":40,"stem":"<p>Which is a common approach for choosing how many principal components to retain in PCA?</p>","options":["Retain the principal components that together explain at least 90 % of the variance.","Retain all principal components.","Retain only the first principal component.","Retain the principal components that explain the least variance."],"ans":0,"expl":"The usual heuristic is to keep the smallest number of components whose cumulative explained variance reaches a chosen threshold, commonly 90 % (or 95 %)."}]}]},{"id":2,"fs":[{"n":1,"lvl":"low","note":"Rebuilt from Official Exercise 2 (low) – diagonal movement that retraces at the boundary.","given":[[{"g":"■","c":0,"r":3,"k":"","o":0}],[{"g":"■","c":1,"r":2,"k":"","o":0}],[{"g":"■","c":2,"r":1,"k":"","o":0}],[{"g":"■","c":3,"r":0,"k":"","o":0}]],"o1":[[{"g":"■","c":2,"r":2,"k":"","o":0}],[{"g":"■","c":1,"r":2,"k":"","o":0}],[{"g":"■","c":2,"r":1,"k":"","o":0}]],"o2":[[{"g":"■","c":2,"r":1,"k":"","o":0}],[{"g":"■","c":0,"r":3,"k":"","o":0}],[{"g":"■","c":1,"r":2,"k":"","o":0}]],"a1":3,"a2":3,"rules":["■ moves diagonally upwards to the right one field at a time and retraces its path when it meets a boundary."]},{"n":2,"lvl":"low","note":"","given":[[{"g":"■","c":1,"r":1,"k":"","o":0}],[{"g":"■","c":0,"r":0,"k":"","o":0}],[{"g":"■","c":1,"r":1,"k":"","o":0}],[{"g":"■","c":2,"r":2,"k":"","o":0}]],"o1":[[{"g":"■","c":2,"r":3,"k":"","o":0}],[{"g":"■","c":3,"r":3,"k":"","o":0}],[{"g":"■","c":2,"r":2,"k":"","o":0}]],"o2":[[{"g":"■","c":3,"r":3,"k":"","o":0}],[{"g":"■","c":4,"r":4,"k":"","o":0}],[{"g":"■","c":3,"r":4,"k":"","o":0}]],"a1":2,"a2":2,"rules":["■ moves diagonally upwards to the left one field at a time and retraces its path when it meets a boundary."]},{"n":3,"lvl":"low","note":"","given":[[{"g":"K","c":4,"r":4,"k":"","o":2}],[{"g":"K","c":3,"r":4,"k":"","o":3}],[{"g":"K","c":2,"r":4,"k":"","o":0}],[{"g":"K","c":1,"r":4,"k":"","o":1}]],"o1":[[{"g":"K","c":0,"r":4,"k":"","o":2}],[{"g":"K","c":0,"r":4,"k":"","o":1}],[{"g":"K","c":0,"r":4,"k":"","o":0}]],"o2":[[{"g":"K","c":1,"r":4,"k":"","o":1}],[{"g":"K","c":1,"r":4,"k":"","o":0}],[{"g":"K","c":1,"r":4,"k":"","o":3}]],"a1":1,"a2":3,"rules":["┘ moves horizontally one field at a time in row 5 and bounces off the left/right boundary; it rotates 90° to the right from image to image."]},{"n":4,"lvl":"low","n ,"A"],["B","C","D","A","E"],["A","D","C","E","B"],["D","E","A","B","C"],["E","A","B","C","D"]]},{"n":20,"lvl":"high","note":"","grid":[["D","","","E",""],["E","","","B",""],["","","","D","B"],["","","D","",""],["","","C","",""]],"t":[2,0],"ans":"C","full":[["D","C","B","E","A"],["E","D","A","B","C"],["C","A","E","D","B"],["A","B","D","C","E"],["B","E","C","A","D"]]}],"subject":[{"title":"Testlet 1 — Combinational Logic","area":"Theoretical Computer Science · Questions 1–8","stimulus":"<p>The Boolean operations AND, OR and NOT are written formally as X = (A ∧ B), X = (A ∨ B) and X = ¬A (printed with an overline in the official materials). In circuit diagrams they appear as gates labelled <code>&amp;</code> (AND), <code>≥1</code> (OR) and <code>1</code> with an inverting output bubble (NOT). Inputs take only the values 0 and 1 (<em>false</em> and <em>true</em>):</p><table><thead><tr><th>A</th><th>B</th><th>A ∧ B</th><th>A ∨ B</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td></tr></tbody></table><p>with ¬A = 1 when A = 0 and ¬A = 0 when A = 1. <strong>Throughout this paper the negation of a variable is written ¬A rather than with an overline.</strong></p><p>These three operations are the building blocks of larger Boolean functions. As long as the circuit contains no cycles it realises <strong>combinational logic</strong>, and the circuit is called combinatorial.</p><p>Any truth table can be converted directly into a formula through the <strong>canonical disjunctive normal form (CDNF)</strong>. For every row whose output is 1 a <em>minterm</em> is written: an AND over all inputs, in which the inputs that are 0 in that row appear negated and the inputs that are 1 appear plain. All minterms are then joined with OR. The CDNF of AND has a single minterm, X = (A ∧ B), so no OR is needed; the CDNF of OR has three minterms, X = (¬A ∧ B) ∨ (A ∧ ¬B) ∨ (A ∧ B).</p>","questions":[{"n":1,"stem":"<p>Which Boolean function does the following truth table represent?</p><table><thead><tr><th>A</th><th>B</th><th>X</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>1</td></tr><tr><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></tbody></table>","options":["X = ¬A ∧ ¬B","X = ¬(A ∧ B)","X = A ∨ B","X = ¬A ∨ B"],"ans":0,"expl":"Only the row A = 0, B = 0 gives X = 1, so X is 1 exactly when the negation of A and the negation of B are both 1: X = ¬A ∧ ¬B (a NOR gate)."},{"n":2,"stem":"<p>A jewellery shop has sensors on all of its windows, doors and display cases. The burglar alarm must sound as soon as <strong>any one</strong> of the sensors registers an unusual condition. Which Boolean operation best describes the alarm system?</p>","options":["an AND operation","an OR operation","one AND combined with several OR operations","one OR combined with several AND operations"],"ans":1,"expl":"Each sensor is one variable, 1 = anomaly. The alarm must fire if <em>at least one</em> variable is 1, which is a single large OR over all sensor variables."},{"n":3,"stem":"<p>A combinatorial circuit takes the three inputs A, B and C. Inputs A and B enter an OR gate; input C passes through a NOT gate; the two results enter an AND gate whose output is X — that is, X = (A ∨ B) ∧ ¬C. Three entries of the truth table are missing. What are they?</p><table><thead><tr><th>A</th><th>B</th><th>C</th><th>X</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>{i}</td></tr><tr><td>0</td><td>1</td><td>0</td><td>1</td></tr><tr><td>0</td><td>1</td><td>1</td><td>{ii}</td></tr><tr><td>1</td><td>0</td><td>0</td><td>{iii}</td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>0</td></tr></tbody></table>","options":["i = 0; ii = 1; iii = 1","i = 1; ii = 1; iii = 1","i = 0; ii = 0; iii = 0","i = 0; ii = 0; iii = 1"],"ans":3,"expl":"X = (A ∨ B) ∧ ¬C. Substituting: {i} A=0,B=0,C=1 → (0)∧0 = 0. {ii} A=0,B=1,C=1 → (1)∧0 = 0. {iii} A=1,B=0,C=0 → (1)∧1 = 1."},{"n":4,"stem":"<p>In a circuit, input A first passes through a NOT gate. Its output and input B enter an OR gate. The output of the OR gate passes through a further NOT gate, giving X. Which Boolean function does the circuit realise?</p>","options":["X = ¬(¬A ∨ B)","X = ¬(A ∨ ¬B)","X = A ∧ ¬B","X = ¬(¬A ∧ B)"],"ans":0,"expl":"Read the circuit left to right: A is negated → ¬A; that is OR-ed with B → ¬A ∨ B; the whole result is negated → <strong>X = ¬(¬A ∨ B)</strong>."},{"n":5,"stem":"<p>What is the CDNF for the following truth table?</p><table><thead><tr><th>A</th><th>B</th><th>X</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></tbody></table>","options":["X = (¬A ∧ B) ∨ (A ∧ ¬B) ∨ (A ∧ B)","X = (¬A ∧ ¬B) ∨ (A ∧ B)","X = (¬A ∧ B)","X = (¬A ∧ B) ∨ (A ∧ ¬B)"],"ans":3,"expl":"X = 1 in rows two and three, giving the minterms (¬A ∧ B) and (A ∧ ¬B); joined with OR that is X = (¬A ∧ B) ∨ (A ∧ ¬B) — the exclusive-OR function."},{"n":6,"stem":"<p>A truth table has the four inputs A, B, C and D. In one of its rows the output X is 1 for the input combination A = 1, B = 0, C = 1, D = 1. What is the correct minterm for this row?</p>","options":["A ∧ ¬B ∧ C ∧ D","A ∨ ¬B ∨ C ∨ D","¬A ∧ B ∧ ¬C ∧ ¬D","A ∧ C ∧ D"],"ans":0,"expl":"In a minterm the inputs that are 0 in the row are negated, the rest stay plain, and everything is AND-ed: A = 1, B = 0, C = 1, D = 1 → <strong>A ∧ ¬B ∧ C ∧ D</strong>."},{"n":7,"stem":"<p>A circuit is built as follows. The upper AND gate receives A and ¬B; the lower AND gate receives ¬A and B. The two AND outputs are joined by an OR gate producing X. Which truth table belongs to this circuit?</p>","options":["00 → 1, 01 → 1, 10 → 0, 11 → 0","00 → 1, 01 → 0, 10 → 0, 11 → 1","00 → 0, 01 → 1, 10 → 1, 11 → 0","00 → 0, 01 → 0, 10 → 1, 11 → 1"],"ans":2,"expl":"The circuit computes (A ∧ ¬B) ∨ (¬A ∧ B), i.e. XOR: the output is 1 exactly when the two inputs differ → 00 → 0, 01 → 1, 10 → 1, 11 → 0."},{"n":8,"stem":"<p>How many rows does the complete truth table of a Boolean function with five inputs have?</p>","options":["10","25","32","64"],"ans":2,"expl":"Each input doubles the number of rows: 2⁵ = <strong>32</strong>."}]},{"title":"Testlet 2 — Number Systems and Machine Representation","area":"Applied Computer Science · Questions 9–16","stimulus":"<p>Computers store every value as a fixed-length bit pattern. In the <strong>binary</strong> system the digit at position <em>k</em> (counted from 0 on the right) carries the weight 2ᵏ, so 1011 0110₂ = 128 + 32 + 16 + 4 + 2. The <strong>hexadecimal</strong> system groups four bits into one digit 0–9, A–F, where A = 10 … F = 15; hence 0x2F = 2·16 + 15.</p><p>Signed integers normally use <strong>two's complement</strong>. A negative number −x is encoded by inverting all bits of x and adding 1, which means an <em>n</em>-bit two's-complement type covers the range −2ⁿ⁻¹ … 2ⁿ⁻¹ − 1 and holds 2ⁿ distinct values in total.</p><p>Real numbers use the <strong>IEEE-754</strong> format. A single-precision (32-bit) value is split into 1 sign bit, 8 exponent bits and 23 stored fraction bits; because normalised numbers always begin with a leading 1 that is not written down, the significand is effectively one bit longer than what is stored. The consequence is that only fractions whose denominator is a power of two are exact: a decimal such as 0.1 has a <em>non-terminating</em> binary expansion and is therefore stored as the nearest representable neighbour, which is why accumulated floating-point sums drift away from the exact decimal result.</p>","questions":[{"n":9,"stem":"<p>What is the decimal value of the binary number 1011 0110?</p>","options":["174","182","186","218"],"ans":1,"expl":"1011 0110 = 128 + 32 + 16 + 4 + 2 = <strong>182</strong>."},{"n":10,"stem":"<p>What is the binary representation of the decimal number 45?</p>","options":["101101","110101","101011","111001"],"ans":0,"expl":"45 = 32 + 8 + 4 + 1 = 101101₂."},{"n":11,"stem":"<p>What is the decimal value of the hexadecimal number 0x2F?</p>","options":["31","47","62","79"],"ans":1,"expl":"0x2F = 2 · 16 + 15 = <strong>47</strong>."},{"n":12,"stem":"<p>What is the 8-bit two's-complement representation of −5?</p>","options":["1000 0101","1111 1010","1111 1011","0000 0101"],"ans":2,"expl":"5 = 0000 0101; invert → 1111 1010; add 1 → <strong>1111 1011</strong>. Option b is the one's complement, a standard trap."},{"n":13,"stem":"<p>What is the value range of an 8-bit signed two's-complement integer?</p>","options":["−127 … 127","−128 … 127","0 … 255","−255 … 255"],"ans":1,"expl":"An <em>n</em>-bit two's-complement type covers −2ⁿ⁻¹ … 2ⁿ⁻¹ − 1, so for n = 8 that is −128 … 127. The range is asymmetric because zero occupies one of the non-negative slots."},{"n":14,"stem":"<p>How many distinct values can be encoded with 12 bits?</p>","options":["144","1 024","2 048","4 096"],"ans":3,"expl":"2¹² = <strong>4 096</strong>."},{"n":15,"stem":"<p>Why can the decimal value 0.1 not be stored exactly in an IEEE-754 floating-point variable?</p>","options":["Because 0.1 is smaller than the smallest representable float.","Because its binary expansion does not terminate, so it must be rounded to the nearest representable value.","Because floating-point types can only store integers.","Because the exponent field is limited to 8 bits."],"ans":1,"expl":"0.1 = 1/10, and 10 is not a power of two, so the binary expansion 0.0001100110011… never terminates. The stored value is the nearest representable neighbour, which is why <code>0.1 + 0.2 != 0.3</code> in most languages."},{"n":16,"stem":"<p>An IEEE-754 single-precision number stores 23 fraction bits. Including the implicit leading bit, how many bits does the significand effectively have?</p>","options":["22","23","24","32"],"ans":2,"expl":"23 stored fraction bits plus the implicit leading 1 give an effective significand of <strong>24 bits</strong> (≈ 7 decimal digits of precision)."}]},{"title":"Testlet 3 — Matrices, Vectors and Linear Systems","area":"Mathematics · Questions 17–24","stimulus":"<p>For a square matrix A the <strong>determinant</strong> measures how the associated linear map scales volume; for a 2 × 2 matrix A = [[a, b], [c, d]] it is det(A) = ad − bc. A square matrix is <strong>invertible</strong> exactly when its determinant is non-zero, which is equivalent to saying that it has full rank and that its columns are linearly independent.</p><p>The <strong>eigenvalues</strong> of A solve det(A − λI) = 0. For a 2 × 2 matrix the characteristic polynomial can be written as λ² − tr(A)·λ + det(A) = 0, where the <strong>trace</strong> tr(A) is the sum of the diagonal entries. Two useful identities follow: the sum of the eigenvalues equals the trace, and their product equals the determinant.</p><p>Matrix multiplication is defined when the inner dimensions match: an <em>m × n</em> matrix times an <em>n × p</em> matrix yields an <em>m × p</em> matrix. The <strong>dot product</strong> of two vectors of equal length is the sum of the products of corresponding components.</p><p>For a homogeneous system A·x = 0 with A of size <em>n × n</em>, the number of free variables is <em>n</em> − rank(A). If the rank is full the only solution is the trivial one, x = 0; if the rank is deficient there are infinitely many solutions.</p><p><em>Questions 17–19 refer to the matrix</em></p><pre>M = | 4  1 |\n    | 2  3 |</pre>","questions":[{"n":17,"stem":"<p>What is det(M)?</p>","options":["10","14","12","2"],"ans":0,"expl":"det(M) = 4 · 3 − 1 · 2 = <strong>10</strong>."},{"n":18,"stem":"<p>What are the eigenvalues of M?</p>","options":["1 and 6","2 and 5","3 and 4","4 and 3"],"ans":1,"expl":"λ² − tr(M)·λ + det(M) = λ² − 7λ + 10 = 0 → (λ − 2)(λ − 5) = 0 → λ = <strong>2 and 5</strong>."},{"n":19,"stem":"<p>What is the trace of M, and what does it equal?</p>","options":["7 — the sum of the eigenvalues","7 — the product of the eigenvalues","10 — the sum of the eigenvalues","12 — the determinant"],"ans":0,"expl":"tr(M) = 4 + 3 = 7, and 2 + 5 = 7: the trace equals the <strong>sum</strong> of the eigenvalues. (Their <em>product</em>, 10, equals the determinant.)"},{"n":20,"stem":"<p><em>Questions 20–21 refer to the matrix</em></p><pre>N = | 1  2 |\n    | 2  4 |</pre><p>What is the rank of N?</p>","options":["0","1","2","4"],"ans":1,"expl":"Row 2 = 2 × row 1, so there is only one linearly independent row → rank <strong>1</strong>."},{"n":21,"stem":"<p>Is N invertible?</p>","options":["Yes, because its rank equals the number of its rows.","Yes, because all of its entries are non-zero.","No, because det(N) = 0.","No, because it is not symmetric."],"ans":2,"expl":"det(N) = 1 · 4 − 2 · 2 = 0, so N is singular. Symmetry is irrelevant to invertibility."},{"n":22,"stem":"<p>What is the dot product of the vectors [2, −1, 3] and [1, 4, 2]?</p>","options":["4","12","−4","8"],"ans":0,"expl":"2 · 1 + (−1) · 4 + 3 · 2 = 2 − 4 + 6 = <strong>4</strong>."},{"n":23,"stem":"<p>Matrix A has dimension 3 × 4 and matrix B has dimension 4 × 2. What is the dimension of the product A·B?</p>","options":["4 × 4","3 × 2","2 × 3","the product is undefined"],"ans":1,"expl":"(3 × 4) · (4 × 2): the inner dimensions match, and the result takes the outer ones → <strong>3 × 2</strong>."},{"n":24,"stem":"<p>A 3 × 3 matrix A has rank 2. How many solutions does the homogeneous system A·x = 0 have?</p>","options":["exactly one, namely x = 0","exactly two","infinitely many, forming a one-dimensional solution space","none"],"ans":2,"expl":"Free variables = n − rank = 3 − 2 = 1, so the solution set is a line through the origin: <strong>infinitely many</strong> solutions forming a one-dimensional space."}]},{"title":"Testlet 4 — Relational Data and Query Processing","area":"Applied Computer Science · Questions 25–32","stimulus":"<p>A relational database stores data in tables whose rows are records and whose columns are attributes. A <strong>primary key</strong> identifies each record uniquely and may never be NULL; a <strong>foreign key</strong> references the primary key of another table and so expresses a relationship. <strong>Normalisation</strong> reorganises tables to remove redundant storage of the same fact, which in turn removes the insertion, update and deletion anomalies that redundancy causes.</p><p>An SQL query is evaluated in a fixed logical order: <code>FROM</code> and the joins first, then <code>WHERE</code>, then <code>GROUP BY</code>, then <code>HAVING</code>, then <code>SELECT</code>, and finally <code>ORDER BY</code>. The practical consequence is that <code>WHERE</code> filters <strong>individual rows before</strong> grouping, while <code>HAVING</code> filters <strong>groups after</strong> aggregation. <code>GROUP BY region</code> therefore returns one row per distinct region.</p><p>Joins differ in what they keep. An <code>INNER JOIN</code> returns only rows that match on both sides; a <code>LEFT JOIN</code> returns every row of the left table and fills the right-hand columns with NULL where no match exists.</p><p>An <strong>index</strong> is an auxiliary structure that makes lookups and range scans on the indexed column much faster, at the cost of additional storage and slower inserts and updates, because the index must be maintained.</p><p><em>Questions 28–31 refer to the table</em> <code>Sales</code>.</p><table><thead><tr><th>id</th><th>region</th><th>units</th><th>revenue</th></tr></thead><tbody><tr><td>1</td><td>North</td><td>10</td><td>200</td></tr><tr><td>2</td><td>South</td><td>5</td><td>150</td></tr><tr><td>3</td><td>North</td><td>7</td><td>140</td></tr><tr><td>4</td><td>East</td><td>12</td><td>360</td></tr><tr><td>5</td><td>South</td><td>8</td><td>240</td></tr></tbody></table>","questions":[{"n":25,"stem":"<p>Which SQL clause filters individual rows <em>before</em> any grouping takes place?</p>","options":["`HAVING`","`WHERE`","`ORDER BY`","`GROUP BY`"],"ans":1,"expl":"<code>WHERE</code> is evaluated before <code>GROUP BY</code> and therefore filters individual rows."},{"n":26,"stem":"<p>Which SQL clause filters groups <em>after</em> aggregation?</p>","options":["`WHERE`","`SELECT`","`HAVING`","`LIMIT`"],"ans":2,"expl":"<code>HAVING</code> is evaluated after <code>GROUP BY</code> and filters aggregated groups."},{"n":27,"stem":"<p>What must hold for a column that is declared as a primary key?</p>","options":["Its values must be unique and must never be NULL.","Its values must be unique, but NULL is permitted once.","Its values must be numeric and consecutive.","It must reference a column in another table."],"ans":0,"expl":"A primary key must be unique and NOT NULL. It need not be numeric, and a reference to another table is a <em>foreign</em> key."},{"n":28,"stem":"<p>How many rows does <code>SELECT region, SUM(units) FROM Sales GROUP BY region;</code> return?</p>","options":["2","3","5","1"],"ans":1,"expl":"The distinct regions are North, South and East → <strong>3</strong> rows."},{"n":29,"stem":"<p>How many rows does <code>SELECT region, SUM(revenue) FROM Sales GROUP BY region HAVING SUM(revenue) &gt; 350;</code> return?</p>","options":["1","2","3","0"],"ans":1,"expl":"Sums per region: North = 200 + 140 = 340; South = 150 + 240 = 390; East = 360. Only South and East exceed 350 → <strong>2</strong> rows."},{"n":30,"stem":"<p>What is the result of <code>SELECT AVG(units) FROM Sales WHERE region = 'North';</code>?</p>","options":["8.5","17","6.5","8.4"],"ans":0,"expl":"North has units 10 and 7 → (10 + 7)/2 = <strong>8.5</strong>."},{"n":31,"stem":"<p>The table <code>Sales</code> is joined to a table <code>Products</code> that contains no entry for the region <code>East</code>. How does a <code>LEFT JOIN</code> from <code>Sales</code> differ from an <code>INNER JOIN</code> here?</p>","options":["The `LEFT JOIN` drops the `East` row; the `INNER JOIN` keeps it with NULLs.","The `LEFT JOIN` keeps the `East` row and fills the `Products` columns with NULL; the `INNER JOIN` drops it.","Both return exactly the same rows.","The `LEFT JOIN` duplicates the `East` row once per row of `Products`."],"ans":1,"expl":"A <code>LEFT JOIN</code> preserves every row of the left table and pads the unmatched right-hand columns with NULL, so the <code>East</code> row survives; an <code>INNER JOIN</code> discards it."},{"n":32,"stem":"<p>What is the main trade-off of creating an index on a frequently queried column?</p>","options":["Faster lookups, but additional storage and slower inserts and updates.","Faster inserts, but slower lookups.","Lower storage consumption, but a loss of precision.","There is no trade-off; an index improves every operation."],"ans":0,"expl":"An index speeds up lookups and range scans but consumes storage and must be maintained on every insert, update and delete."}]},{"title":"Testlet 5 — Regression, Inference and Model Selection","area":"Mathematics / Applied Computer Science · Questions 33–40","stimulus":"<p><strong>Simple linear regression</strong> fits the straight line ŷ = b₀ + b₁·x that minimises the sum of squared residuals. The least-squares estimates are</p><blockquote><p>b₁ = Σ(xᵢ − mean(x))(yᵢ − mean(y)) / Σ(xᵢ − mean(x))²   and   b₀ = mean(y) − b₁·mean(x),</p></blockquote><p>and the <strong>residual</strong> of an observation is eᵢ = yᵢ − ŷᵢ. The <strong>coefficient of determination</strong> R² is the proportion of the variance of <em>y</em> that the model explains, so R² = 1 means every point lies exactly on the line.</p><p>Because squared errors grow quadratically, the <strong>mean squared error</strong> reacts far more strongly to a single large deviation than the <strong>mean absolute error</strong> does. Error measures therefore encode a modelling decision, not just a summary.</p><p><strong>Regularisation</strong> counteracts overfitting by adding a penalty on the size of the coefficients: L2 (<em>ridge</em>) shrinks all coefficients smoothly towards zero and reduces variance at the price of a little bias, while L1 (<em>lasso</em>) can drive coefficients exactly to zero and thus performs feature selection. <strong>k-fold cross-validation</strong> splits the data into <em>k</em> equally sized folds, trains <em>k</em> times on <em>k</em> − 1 folds and validates on the remaining one, then averages the <em>k</em> scores.</p><p><em>Questions 33–36 refer to the data set</em></p><table><thead><tr><th>x</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td><strong>y</strong></td><td>2</td><td>4</td><td>5</td><td>4</td><td>5</td></tr></tbody></table>","questions":[{"n":33,"stem":"<p>What is the least-squares slope b₁?</p>","options":["0.6","1.0","0.8","0.5"],"ans":0,"expl":"b₁ = 6/10 = <strong>0.6</strong>."},{"n":34,"stem":"<p>What is the least-squares intercept b₀?</p>","options":["4.0","2.2","1.8","2.6"],"ans":1,"expl":"b₀ = mean(y) − b₁·mean(x) = 4 − 0.6 · 3 = <strong>2.2</strong>."},{"n":35,"stem":"<p>What value does the fitted model predict for x = 6?</p>","options":["5.8","6.0","5.2","6.4"],"ans":0,"expl":"ŷ = 2.2 + 0.6 · 6 = <strong>5.8</strong>."},{"n":36,"stem":"<p>What is the residual of the observation at x = 1?</p>","options":["+0.8","−0.8","−0.2","+0.2"],"ans":1,"expl":"ŷ(1) = 2.2 + 0.6 = 2.8; residual = y − ŷ = 2 − 2.8 = <strong>−0.8</strong>. (Sign matters: the model over-predicts here.)"},{"n":37,"stem":"<p>How should R² = 0.84 be interpreted?</p>","options":["84 % of the predictions are exactly correct.","The model explains 84 % of the variance of the dependent variable.","The correlation between x and y is 0.84.","84 % of the residuals are zero."],"ans":1,"expl":"R² is the share of the variance of the dependent variable accounted for by the model. It says nothing about how many individual predictions are exactly right."},{"n":38,"stem":"<p>What is the effect of L2 (ridge) regularisation on a linear model?</p>","options":["It shrinks the coefficients towards zero, lowering variance at the cost of some bias.","It sets a fixed number of coefficients exactly to zero.","It increases the number of features.","It removes the intercept from the model."],"ans":0,"expl":"Ridge adds a penalty proportional to the squared coefficients, shrinking them smoothly towards — but never exactly to — zero. Driving coefficients exactly to zero is the behaviour of L1 / lasso."},{"n":39,"stem":"<p>A data set of 200 observations is evaluated with 5-fold cross-validation. How large is each validation fold, and how often is the model trained?</p>","options":["40 observations, trained 5 times","50 observations, trained 4 times","40 observations, trained once","100 observations, trained 2 times"],"ans":0,"expl":"200 / 5 = 40 observations per fold, and the model is refitted once per fold, so <strong>5 times</strong>."},{"n":40,"stem":"<p>A data set contains a few extreme outliers. Which statement about the error measure is correct?</p>","options":["MSE is less sensitive to the outliers than MAE.","MSE and MAE react identically to the outliers.","MSE is more sensitive to the outliers than MAE, because deviations are squared.","Neither measure may be used when outliers are present."],"ans":2,"expl":"Squaring amplifies large deviations, so MSE is dominated by outliers far more than MAE. This is a reason to prefer MAE, or a robust loss such as Huber, when outliers are genuine data rather than errors."}]}]},{"id":3,"fs":[{"n":1,"lvl":"low","note":"","given":[[{"g":"A","c":2,"r":3,"k":"","o":1}],[{"g":"A","c":3,"r":3,"k":"","o":0}],[{"g":"A","c":4,"r":3,"k":"","o":3}],[{"g":"A","c":3,"r":3,"k":"","o":2}]],"o1":[[{"g":"A","c":2,"r":3,"k":"","o":1}],[{"g":"A","c":3,"r":2,"k":"","o":1}],[{"g":"A","c":2,"r":3,"k":"","o":0}]],"o2":[[{"g":"A","c":1,"r":4,"k
