<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dMAT Practice Suite — Data Science</title>
<link rel="stylesheet" href="styles.css"><!--__CSS__-->
</head>
<body>
<header><div class="hd">
  <div class="logo"></div>
  <div class="brand">dMAT<small>Practice Suite</small></div>
  <div class="spacer"></div>
  <div id="timer" class="timer hide">00:00</div>
  <button class="btn sm" id="homeBtn" onclick="goHome()">All papers</button>
</div></header>

<div class="tabs hide" id="tabs"><div class="in" id="tabsIn"></div></div>

<div class="wrap" id="app"></div>

<div class="footbar hide" id="foot"><div class="fb">
  <span id="fstat" class="muted" style="font-size:13px"></span>
  <div class="prog"><i id="fprog"></i></div>
  <button class="btn" onclick="prevTab()">&#8592; Prev</button>
  <button class="btn" onclick="nextTab()">Next &#8594;</button>
  <button class="btn pri" onclick="finish()">Submit paper</button>
</div></div>

<script id="dmat-data" type="application/json">null</script><!--__DATA__-->
<script src="app.js"></script><!--__JS__-->
</body>
</html>
